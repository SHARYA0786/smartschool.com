/* ================= SMART LOCATION NORMALIZERS ================= */
const cleanText = (t) => String(t || '').trim().toLowerCase();
const stripPunct = (t) => cleanText(t).replace(/[^a-z0-9]/g, '');

const normalizeState = (rawState) => {
  if (!rawState) return '';
  const c = cleanText(rawState);
  if (STATE_ALIASES[c]) return STATE_ALIASES[c];
  const p = stripPunct(c);
  for (const [k, v] of Object.entries(STATE_ALIASES)) {
    if (stripPunct(k) === p) return v;
  }
  return rawState.trim();
};

const isMosqueInState = (m, targetState) => {
  if (!targetState || targetState === 'all') return true;
  const normTarget = normalizeState(targetState);
  const targetKey = stripPunct(normTarget);
  if (!targetKey) return true;

  const mStateNorm = normalizeState(m.stateName);
  const mStateKey = stripPunct(mStateNorm);
  if (mStateKey === targetKey || mStateKey.includes(targetKey) || targetKey.includes(mStateKey)) return true;

  const addrKey = stripPunct(m.address);
  const locKey = stripPunct(m.stateLocation);
  if (addrKey.includes(targetKey) || locKey.includes(targetKey)) return true;

  if (targetKey === 'uttarpradesh' && (/\bup\b/i.test(m.stateName || '') || /\bup\b/i.test(m.address || ''))) return true;
  if (targetKey === 'madhyapradesh' && (/\bmp\b/i.test(m.stateName || '') || /\bmp\b/i.test(m.address || ''))) return true;
  return false;
};

const isMosqueInDistrict = (m, targetDistrict) => {
  if (!targetDistrict || targetDistrict === 'all') return true;
  const tKey = stripPunct(targetDistrict);
  if (!tKey) return true;
  const locKey = stripPunct(m.stateLocation);
  const addrKey = stripPunct(m.address);
  const nameKey = stripPunct(m.name);
  return locKey.includes(tKey) || addrKey.includes(tKey) || tKey.includes(locKey);
};

/* ================= GENERAL HELPERS ================= */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const addMonths = (s, n) => {
  const d = new Date((s || today()) + 'T00:00:00');
  const day = d.getDate();
  d.setMonth(d.getMonth() + n);
  if (d.getDate() < day) d.setDate(0);
  return iso(d);
};
const daysLeft = s => s ? Math.ceil((new Date(s + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 86400000) : null;
const eff = m => {
  const s = m.paymentStatus || 'free';
  return (s === 'paid' && m.paymentExpiry && m.paymentExpiry < today()) ? 'expired' : s;
};

const compress = (file, max = 400, q = 0.8) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onerror = rej;
  r.onload = e => {
    const im = new Image();
    im.onerror = rej;
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k);
      c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', q));
    };
    im.src = e.target.result;
  };
  r.readAsDataURL(file);
});

    const targetMasjid = masjids[nextPending.masjidId] || all.find(m => m.phone === nextPending.phone) || {};
    const templateIdx = Math.floor(Math.random() * 5);
    const resMsg = getDynamicResetMessage(nextPending, targetMasjid, templateIdx);
    const phoneToSend = nextPending.phone || targetMasjid.phone;

    if (!phoneToSend) {
      say(`⚠️ ${targetMasjid.name || nextPending.masjidName} का फ़ोन नंबर नहीं मिला (अनुरोध लंबित रखा गया)`, 'err');
      return;
    }

    // MODE 1: Server Baileys WhatsApp Bot is connected & linked
    if (serverBotStatus.connected) {
      setBotSendingQueue(true);
      fetch('/api/baileys/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: phoneToSend,
          text: resMsg.text,
          masjidId: targetMasjid.id || nextPending.masjidId
        })
      })
      .then(async res => {
        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) {
          throw new Error('बैकएंड सर्वर से संपर्क नहीं हुआ');
        }
        return res.json();
      })
      .then(data => {
        if (data.success) {
          completeAndResolveDuplicates(nextPending, false).then(() => {
            say(`🤖 बॉट: ${targetMasjid.name || nextPending.masjidName} को WhatsApp पासवर्ड डिलीवर हुआ और रीसेट नोटिफिकेशन हटा दी गई!`);
            setBotCooldownRemaining(botIntervalSeconds);
            setBotSendingQueue(false);
          });
        } else {
          console.warn('Baileys auto-send error:', data);
          say(`बॉट त्रुटि: ${data.error || 'मैसेज नहीं भेजा जा सका'} (नोटिफिकेशन सुरक्षित रखी गई)`, 'err');
          setBotCooldownRemaining(15);
          setBotSendingQueue(false);
        }
      })
      .catch(err => {
        console.warn('Baileys network error / No server:', err.message);
        say(`बॉट एरर: ${err.message} (नोटिफिकेशन डिलीट नहीं की गई)`, 'err');
        setBotCooldownRemaining(20);
        setBotSendingQueue(false);
      });
      return;
    }

    const isBrowserAutoPopupEnabled = localStorage.getItem('mca_auto_popup_wa') === '1';
    if (isBrowserAutoPopupEnabled && !botSendingQueue) {
      setBotSendingQueue(true);
      try {

  /* Plan Activation with Automatic Multi-Month Calculation */
  const activateWithAmount = async (m, amountPaid, monthlyRate = 10, note = 'Admin manual activation') => {
    const amt = Number(amountPaid) || 0;
    const rate = Number(monthlyRate) || Number(S.monthlyFee) || 10;
    const calculatedMonths = Math.max(1, Math.floor(amt / rate));
    const base = (m.paymentExpiry && m.paymentExpiry >= today() && eff(m) === 'paid') ? m.paymentExpiry : today();
    const expiry = addMonths(base, calculatedMonths);

    const updateData = {
      paymentPlan: calculatedMonths >= 12 ? 'yearly' : 'monthly',
      paymentStatus: 'paid',
      paymentExpiry: expiry,
      paymentAmount: amt,
      paymentStart: today(),
      liveAzanAllowed: m.liveAzanAllowed !== false,
      timeEditAllowed: m.timeEditAllowed !== false,
      isVerified: !!m.isVerified,
      pendingUtr: null,
      paymentNotes: note
    };

    await patch(m.id, updateData);
    if (amt > 0) {
      await logPay(m, updateData.paymentPlan, amt, `${calculatedMonths} Months @ ₹${rate}/mo - ${note}`);
    }
    say(`${m.name}: ₹${amt} के आधार पर ${calculatedMonths} महीने सक्रिय (वैध: ${expiry})`);
  };

    if (!raw || !pass) {

    const cleanDigits = raw.replace(/\D/g, '');
    const isMobile = cleanDigits.length === 10;
    const emailToUse = isMobile ? `admin_${cleanDigits}@masjidconnect.admin` : raw;

    const masterCodes = ['786', 'admin786', S.adminPasscode || '786'];
    if (masterCodes.includes(pass) || masterCodes.includes(raw)) {
      const adminSession = {
        email: isMobile ? `Admin Mobile (${cleanDigits})` : raw,

    if (auth) {

        setUser(cred.user);
        setLLoading(false);
        say('Logged in successfully!');

      } catch (er) {
        if (er.code === 'auth/user-not-found' && pass.length >= 6) {
          try {
            const newCred = await auth.createUserWithEmailAndPassword(emailToUse, pass);
            localStorage.setItem('mca_admin_session', JSON.stringify({ email: newCred.user.email, uid: newCred.user.uid }));
            setUser(newCred.user);
            setLLoading(false);
            say('Admin account created & logged in!');
            return;

        }
        let msg = er.message;
        if (er.code === 'auth/wrong-password' || er.code === 'auth/invalid-credential') {
          msg = 'Galat password ya credentials! (Master Passcode "786" bhi use kar sakte hain)';
        } else if (er.code === 'auth/invalid-email') {
          msg = 'Kripya sahi Email ya 10-digit Mobile number dalein.';
        } else if (er.code === 'auth/user-not-found') {
          msg = 'Account nahi mila. Aap Master Passcode (786) se turant login kar sakte hain.';

  /* ================= DERIVED COMPUTATIONS & SMART FILTERS ================= */
  const all = useMemo(() => Object.values(masjids), [masjids]);

  const statesInDb = useMemo(() => {

        if (d) set.add(d);

  const list = useMemo(() => {
    const k = q.trim().toLowerCase();
    return all.filter(m => {
      if (k && ![
        m.name, m.id, m.stateLocation, m.stateName, m.address, m.imamName, m.phone, m.passcode
      ].some(x => String(x || '').toLowerCase().includes(k))) return false;

      if (fState !== 'all' && !isMosqueInState(m, fState)) return false;
      if (fDistrict !== 'all' && !isMosqueInDistrict(m, fDistrict)) return false;

      const s = eff(m);
      if (fStat === 'paid' || fStat === 'free' || fStat === 'expired' || fStat === 'pending') return s === fStat;
      if (fStat === 'suspended') return !!m.isSuspended;
      if (fStat === 'verified') return !!m.isVerified;
      if (fStat === 'live') return !!live[m.id];
      if (fStat === 'azan_blocked') return m.liveAzanAllowed === false;
      if (fStat === 'edit_locked') return m.timeEditAllowed === false;
      if (fStat === 'nogps') return !hasGps(m);
      return true;
    }).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  }, [all, q, fState, fDistrict, fStat, live]);

  // Dynamic Revenue: Active Subscriptions sum + Audit Log sum
  const st = useMemo(() => {
    const c = x => all.filter(x).length;
    const mo = today().slice(0, 7);
    // Active Paid Revenue drops immediately if a mosque is marked free, expired, or locked
    const activePaidRev = all.filter(m => eff(m) === 'paid').reduce((s, m) => s + (Number(m.paymentAmount) || 0), 0);
    const logRevAll = logs.reduce((s, l) => s + (Number(l.amount) || 0), 0);
    const logRevMo = logs.filter(l => (l.date || '').startsWith(mo)).reduce((s, l) => s + (Number(l.amount) || 0), 0);

    return {
      total: all.length,
      active: c(m => !m.isSuspended),
      susp: c(m => m.isSuspended),
      paid: c(m => eff(m) === 'paid'),
      free: c(m => eff(m) === 'free'),
      exp: c(m => eff(m) === 'expired'),
      ver: c(m => m.isVerified),
      nogps: c(m => !hasGps(m)),
      live: Object.keys(live).length,
      fol: all.reduce((s, m) => s + (m.followersCount || 0), 0),
      activePaidRev,
      revAll: logRevAll,
      revMo: logRevMo,
      pendingResets: passwordResets.filter(r => r.status !== 'completed').length,
      pendingFeedbacks: feedbacks.filter(f => f.status !== 'resolved').length,
      soon: all.filter(m => eff(m) === 'paid' && daysLeft(m.paymentExpiry) !== null && daysLeft(m.paymentExpiry) <= 7).sort((a, b) => a.paymentExpiry.localeCompare(b.paymentExpiry)),
      byState: Object.entries(all.reduce((o, m) => {
        const k = normalizeState(m.stateName) || 'Unknown';
        o[k] = (o[k] || 0) + 1;
        return o;
      }, {})).sort((a, b) => b[1] - a[1]).slice(0, 8)
    };
  }, [all, logs, live, passwordResets, feedbacks]);

  // All 36 States with registered + un-registered stats
  const allIndiaStatesData = useMemo(() => {
    return ALL_INDIA_STATES.map(stateName => {
      const mosquesInState = all.filter(m => isMosqueInState(m, stateName));
      const total = mosquesInState.length;
      const suspended = mosquesInState.filter(m => m.isSuspended).length;
      const active = total - suspended;
      const isConfigBanned = (S.bannedStates || []).some(b => stripPunct(b) === stripPunct(stateName));
      return {
        name: stateName,
        total,
        active,
        suspended,
        districtsCount: (INDIA_STATE_DISTRICTS[stateName] || []).length,
        isFullyBanned: isConfigBanned || (total > 0 && suspended === total),
        isPartiallyBanned: !isConfigBanned && suspended > 0 && suspended < total
      };
    }).sort((a, b) => {
      if (a.total !== b.total) return b.total - a.total;
      return a.name.localeCompare(b.name);
    });
  }, [all, S.bannedStates]);

  const NAV = [
    ['dashboard', '📊', 'Dashboard'],
    ['masjids', '🕌', 'Mosques'],
    ['regions', '🗺️', 'State & District Ban'],
    ['resets', '🔑', 'Password Resets'],
    ['feedback', '💬', 'शिकायत व सुझाव'],
    ['plans', '💳', 'Plans & Payments'],
    ['broadcast', '📢', 'Broadcast'],
    ['settings', '⚙️', 'Settings']
  ];

  const Logo = ({ s = 40 }) => S.logo ? (
    <img src={S.logo} alt="" style={{ width: s, height: s }} className="rounded-xl object-cover bg-white" />
  ) : (
    <div style={{ width: s, height: s }} className="rounded-xl bg-white/15 flex items-center justify-center text-xl">🕌</div>
  );

  /* ================= LOGIN SCREEN ================= */
  if (user === undefined) return <div className="min-h-screen flex items-center justify-center text-sm text-slate-500 font-bold">Checking credentials…</div>;
  if (!user) {
    return (
      <div className="min-h-screen flex items-center justify-center p-4 relative" style={{ background: `linear-gradient(135deg, ${S.accent}, #052e22)` }}>
        <div className={`${card} w-full max-w-md p-6 sm:p-8 space-y-5 shadow-2xl relative z-10`}>
          <div className="text-center">
            <div className="mx-auto w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg" style={{ background: S.accent }}>
              <Logo s={48} />
            </div>
            <h1 className="fm text-2xl font-black mt-3 text-slate-900 dark:text-white">{S.brand}</h1>
            <p className="text-xs text-slate-500 dark:text-slate-400 font-semibold">{S.tagline}</p>
          </div>

          <div className="grid grid-cols-2 p-1 bg-slate-100 dark:bg-slate-700/60 rounded-xl text-xs font-bold">
            <button
              type="button"
              onClick={() => { setLoginMode('credentials'); setLErr(''); }}
              className={`py-2 rounded-lg transition ${loginMode === 'credentials' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-xs' : 'text-slate-500 hover:text-slate-800 dark:hover:text-white'}`}
            >
              📧 Email / 📱 Mobile
            </button>
            <button
              type="button"
              onClick={() => { setLoginMode('passcode'); setLErr(''); }}
              className={`py-2 rounded-lg transition ${loginMode === 'passcode' ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-xs' : 'text-slate-500 hover:text-slate-800 dark:hover:text-white'}`}
            >
              🔐 Master Passcode
            </button>
          </div>

          {loginMode === 'credentials' && (
            <form onSubmit={handleCredentialLogin} className="space-y-3.5">
              <div>
                <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">Admin Email ya 10-Digit Mobile Number</label>
                <input
                  className={inp}
                  type="text"
                  placeholder="e.g. roshan173434@gmail.com ya 8084329613"
                  value={lInput}
                  onChange={e => setLInput(e.target.value)}
                  required
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">Password ya Master Key (786)</label>
                <input
                  className={inp}
                  type="password"
                  placeholder="Password / 786"
                  value={lPass}
                  onChange={e => setLPass(e.target.value)}
                  required
                />
              </div>

              {lErr && <div className="p-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs font-bold">{lErr}</div>}

              <button
                type="submit"
                disabled={lLoading}
                className="w-full py-3 rounded-xl text-white font-extrabold text-sm shadow-md active:scale-98 transition flex items-center justify-center gap-2"
                style={{ background: S.accent }}
              >
                {lLoading ? 'Verifying…' : 'Sign in to Admin Panel'}
              </button>

              <div className="text-[11px] text-slate-500 dark:text-slate-400 text-center leading-relaxed">
                💡 <b>Tip:</b> Email ya 10-digit mobile dalein. Password yaad na ho to <b>786</b> se login karein.
              </div>
            </form>
          )}

          {loginMode === 'passcode' && (
            <form onSubmit={handlePasscodeLogin} className="space-y-3.5">
              <div>
                <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">Master Admin Passcode</label>
                <input
                  className={`${inp} font-mono text-center text-lg tracking-widest`}
                  type="password"
                  placeholder="Enter 786"
                  value={lPasscode}
                  onChange={e => setLPasscode(e.target.value)}
                  required
                  autoFocus
                />
              </div>

              {lErr && <div className="p-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs font-bold">{lErr}</div>}

              <button
                type="submit"
                className="w-full py-3 rounded-xl text-white font-extrabold text-sm shadow-md active:scale-98 transition"
                style={{ background: S.accent }}
              >
                Unlock Super Admin (786)
              </button>

              <p className="text-[11.5px] text-slate-500 dark:text-slate-400 text-center">
                Default Master Passcode: <span className="font-mono font-bold text-amber-600 dark:text-amber-400">786</span>
              </p>
            </form>
          )}
        </div>
      </div>
    );
  }

  /* ================= MAIN APPLICATION SHELL ================= */
  return (
    <div className="min-h-screen">
      {/* Toast Alert */}
      {toast && (
        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[999] px-4 py-2.5 rounded-xl shadow-2xl text-xs font-bold max-w-[92%] text-white transition-all duration-200 ${toast.t === 'err' ? 'bg-rose-600' : 'bg-slate-900 border border-slate-700'}`}>
          {toast.t === 'err' ? '⚠️ ' : '✅ '}{toast.m}
        </div>
      )}

      {/* Mobile Drawer Overlay */}
      {drawer && (
        <div 
          onClick={() => setDrawer(false)} 
          className="fixed inset-0 bg-black/60 z-40 md:hidden backdrop-blur-xs transition-opacity" 
        />
      )}

      {/* Professional Left Sidebar (Permanently Docked on Desktop md:translate-x-0) */}
      <aside className={`fixed top-0 left-0 bottom-0 z-50 w-64 lg:w-72 bg-white dark:bg-slate-800 shadow-xl md:shadow-lg flex flex-col border-r dark:border-slate-700 transition-transform duration-300 ${drawer ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
        <div className="p-4 text-white flex items-center justify-between gap-3 shrink-0" style={{ background: `linear-gradient(135deg, ${S.accent}, #052e22)` }}>
          <div className="flex items-center gap-3 min-w-0">
            <Logo s={40} />
            <div className="min-w-0">
              <div className="fm text-base truncate font-black">{S.brand}</div>
              <div className="text-[10.5px] text-emerald-200 truncate font-mono">{user.email || 'Super Admin'}</div>
            </div>
          </div>
          <button onClick={() => setDrawer(false)} className="md:hidden w-8 h-8 rounded-lg bg-white/20 hover:bg-white/30 flex items-center justify-center text-xs font-bold transition">
            ✕
          </button>
        </div>
        <nav className="p-3 space-y-1.5 flex-1 overflow-y-auto thin">
          {NAV.map(([id, ic, lb]) => (
            <button
              key={id}
              onClick={() => { setPage(id); setDrawer(false); }}
              className={`w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-xs sm:text-[13px] font-extrabold text-left transition ${page === id ? 'text-white shadow-md' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60 text-slate-700 dark:text-slate-200'}`}
              style={page === id ? { background: `linear-gradient(90deg, ${S.accent}, #0a4f3b)` } : {}}
            >
              <span className="text-lg shrink-0">{ic}</span>
              <span className="truncate">{lb}</span>
              {id === 'resets' && st.pendingResets > 0 && (
                <span className="ml-auto text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded-full font-black animate-pulse">
                  {st.pendingResets}
                </span>
              )}
              {id === 'feedback' && st.pendingFeedbacks > 0 && (
                <span className="ml-auto text-[10px] bg-rose-500 text-white px-2 py-0.5 rounded-full font-black">
                  {st.pendingFeedbacks}
                </span>
              )}
              {id === 'plans' && reqs.length > 0 && (
                <span className="ml-auto text-[10px] bg-amber-400 text-slate-900 px-2 py-0.5 rounded-full font-black">{reqs.length}</span>
              )}
              {id === 'masjids' && <span className="ml-auto text-[10px] opacity-75 font-mono font-bold bg-slate-200/60 dark:bg-slate-700 px-2 py-0.5 rounded-full">{st.total}</span>}
              {id === 'regions' && <span className="ml-auto text-[10px] bg-rose-100 text-rose-800 dark:bg-rose-950/60 dark:text-rose-300 px-1.5 py-0.5 rounded font-black">{st.susp}</span>}
            </button>
          ))}
        </nav>
        <div className="p-3.5 border-t dark:border-slate-700 text-[11px] text-slate-400 flex justify-between items-center bg-slate-50/70 dark:bg-slate-850 shrink-0">
          <span className="font-semibold text-slate-500 dark:text-slate-400">Admin Control</span>
          <span className="font-mono font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300 px-2 py-0.5 rounded-md">{all.length} Mosques</span>
        </div>
      </aside>

      {/* Main Content Area (Offset permanently on desktop by md:ml-64 lg:ml-72) */}
      <div className="min-h-screen md:ml-64 lg:ml-72 flex flex-col transition-all duration-300">
        {/* Top Header */}
        <header className="sticky top-0 z-30 text-white shadow-md transition-all duration-300" style={{ background: `linear-gradient(90deg, ${S.accent}, #063b2c)` }}>
          <div className="flex items-center gap-3 px-3 sm:px-6 h-16 w-full">
            {/* Hamburger button visible only on mobile */}
            <button
              onClick={() => setDrawer(prev => !prev)}
              aria-label="Toggle Menu"
              className="md:hidden w-10 h-10 rounded-xl flex flex-col items-center justify-center gap-[5px] bg-white/15 hover:bg-white/25 active:scale-95 transition"
              title="Menu"
            >
              <i className="block w-5 h-0.5 bg-white rounded" />
              <i className="block w-5 h-0.5 bg-white rounded" />
              <i className="block w-5 h-0.5 bg-white rounded" />
            </button>

            <Logo s={38} />
            <div className="min-w-0">
              <div className="fm text-lg leading-tight truncate font-bold">{S.brand}</div>
              <div className="text-[11px] text-white/70 truncate">{S.tagline}</div>
            </div>
            <div className="ml-auto flex items-center gap-2">
              {st.pendingResets > 0 && (
                <button onClick={() => setPage('resets')} className="flex items-center gap-1 text-[11px] px-2.5 py-1 rounded-full bg-emerald-500 text-white font-black animate-pulse shadow-xs">
                  <span>🔑 {st.pendingResets} Reset</span>
                </button>
              )}
              {st.pendingFeedbacks > 0 && (
                <button onClick={() => setPage('feedback')} className="flex items-center gap-1 text-[11px] px-2.5 py-1 rounded-full bg-rose-500 text-white font-black shadow-xs">
                  <span>💬 {st.pendingFeedbacks} New</span>
                </button>
              )}
              <span className="hidden sm:flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-full bg-white/10 font-bold">
                <i className={`w-2 h-2 rounded-full ${loaded ? 'bg-emerald-300' : 'bg-amber-300'}`} />
                {loaded ? 'Firestore Live' : 'Connecting…'}
              </span>
              <button onClick={() => setDark(!dark)} className="w-10 h-10 rounded-xl bg-white/15 hover:bg-white/25 flex items-center justify-center text-sm transition" title="Toggle Theme">
                {dark ? '☀️' : '🌙'}
              </button>
              <button onClick={handleLogout} className="px-3 h-10 rounded-xl bg-rose-600/80 hover:bg-rose-600 text-xs font-bold transition">
                Logout
              </button>
            </div>
          </div>
        </header>

        {/* Main Page Content */}
        <main className="max-w-7xl mx-auto p-3 sm:p-6 space-y-5">

          {/* ============ PAGE 1: DASHBOARD ============ */}
          {page === 'dashboard' && (
            <>
              {/* ============ UNIFIED LUXURY DASHBOARD MASTER HEADER ============ */}
              <div 
                className="relative overflow-hidden rounded-3xl p-5 sm:p-6 text-white shadow-xl border border-emerald-500/30 transition-all duration-300"
                style={{ background: `linear-gradient(135deg, ${S.accent} 0%, #064e3b 45%, #032b20 100%)` }}
              >
                {/* Ambient glow decoration */}
                <div className="absolute -right-12 -bottom-12 w-64 h-64 bg-emerald-400/15 rounded-full blur-3xl pointer-events-none" />
                <div className="absolute -left-12 -top-12 w-48 h-48 bg-teal-400/10 rounded-full blur-2xl pointer-events-none" />

                <div className="relative z-10 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5">
                  {/* Left: Brand / Heading identity */}
                  <div className="flex items-start sm:items-center gap-4">
                    <div className="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-white/15 backdrop-blur-md border border-white/20 flex items-center justify-center text-2xl sm:text-3xl shadow-inner shrink-0">
                      🕌
                    </div>
                    <div className="min-w-0">
                      <div className="flex flex-wrap items-center gap-2.5">
                        <h2 className="fm text-xl sm:text-2xl lg:text-[26px] font-black tracking-wide text-white drop-shadow-xs">
                          {S.brand} — Dashboard Control Center
                        </h2>
                        <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10.5px] font-bold bg-emerald-400/20 border border-emerald-300/40 text-emerald-200">
                          <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                          <span>LIVE SYNC</span>
                        </span>
                      </div>
                      <p className="text-xs sm:text-[13px] text-emerald-100/80 mt-1 max-w-2xl leading-relaxed">
                        ऑल इंडिया रियल-टाइम नेटवर्क स्टेटस · कुल <b>{all.length} मस्जिदें</b> कनेक्टेड · लाइव अज़ान, पासवर्ड रीसेट व सदस्यता नियंत्रण
                      </p>

                      {/* Quick Live Counters Strip */}
                      <div className="flex flex-wrap items-center gap-2 pt-3">
                        <span className="px-2.5 py-1 rounded-xl bg-black/25 backdrop-blur-xs text-[11px] font-semibold text-emerald-100 border border-white/10 flex items-center gap-1.5">
                          <span>🕌</span>
                          <span>कुल मस्जिदें: <b className="font-mono text-white">{st.total}</b></span>
                        </span>
                        <span className="px-2.5 py-1 rounded-xl bg-black/25 backdrop-blur-xs text-[11px] font-semibold text-emerald-100 border border-white/10 flex items-center gap-1.5">
                          <span>🔊</span>
                          <span>लाइव अज़ान: <b className="font-mono text-white">{st.live}</b></span>
                        </span>
                        <span className="px-2.5 py-1 rounded-xl bg-black/25 backdrop-blur-xs text-[11px] font-semibold text-emerald-100 border border-white/10 flex items-center gap-1.5">
                          <span>🔵</span>
                          <span>वेरिफाइड: <b className="font-mono text-white">{st.ver}</b></span>
                        </span>
                        <span className="px-2.5 py-1 rounded-xl bg-black/25 backdrop-blur-xs text-[11px] font-semibold text-emerald-100 border border-white/10 flex items-center gap-1.5">
                          <span>👥</span>
                          <span>फॉलोअर्स: <b className="font-mono text-white">{st.fol}</b></span>
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* Right: Integrated Action Suite */}
                  <div className="flex flex-wrap items-center gap-2 lg:justify-end shrink-0 pt-2 lg:pt-0 border-t lg:border-t-0 border-white/15">
                    {st.pendingResets > 0 && (
                      <button 
                        onClick={() => setPage('resets')} 
                        className="px-3.5 py-2 rounded-xl text-xs font-black bg-amber-400 text-slate-950 hover:bg-amber-300 transition shadow-md flex items-center gap-1.5 animate-bounce"
                      >
                        <span>🔑 {st.pendingResets} पासवर्ड रीसेट</span>
                      </button>
                    )}
                    {st.pendingFeedbacks > 0 && (
                      <button 
                        onClick={() => setPage('feedback')} 
                        className="px-3.5 py-2 rounded-xl text-xs font-black bg-rose-500 text-white hover:bg-rose-400 transition shadow-md flex items-center gap-1.5"
                      >
                        <span>💬 {st.pendingFeedbacks} शिकायतें</span>
                      </button>
                    )}
                    <button 
                      onClick={() => setPage('masjids')} 
                      className="px-3.5 py-2 rounded-xl text-xs font-black bg-white text-emerald-950 hover:bg-emerald-50 transition shadow-md flex items-center gap-1.5"
                    >
                      <span>🕌 मस्जिदें प्रबंधित करें</span>
                    </button>
                    <button 
                      onClick={() => setPage('regions')} 
                      className="px-3.5 py-2 rounded-xl text-xs font-black bg-black/30 hover:bg-black/40 text-white border border-white/20 transition flex items-center gap-1.5"
                    >
                      <span>🗺️ ऑल इंडिया बैन</span>
                    </button>
                    <button 
                      onClick={() => setPage('settings')} 
                      className="px-3 py-2 rounded-xl text-xs font-black bg-white/15 hover:bg-white/25 text-white border border-white/20 transition flex items-center gap-1.5"
                      title="सेटिंग्स"
                    >
                      <span>⚙️</span>
                    </button>
                  </div>
                </div>
              </div>

              {/* Password Resets Alert Banner */}
              {st.pendingResets > 0 && (
                <div className="p-3.5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border-2 border-emerald-500 flex flex-wrap items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🔔</span>
                    <div>
                      <h4 className="font-black text-xs text-emerald-900 dark:text-emerald-200">
                        {st.pendingResets} इमाम ने पासवर्ड रीसेट का अनुरोध भेजा है!
                      </h4>
                      <p className="text-[11px] text-emerald-700 dark:text-emerald-400">
                        1-Click में WhatsApp पर उनके रजिस्टर्ड मोबाइल नंबर पर मस्जिद ID और पासवर्ड भेजें।
                      </p>
                    </div>
                  </div>
                  <button onClick={() => setPage('resets')} className={`${B} bg-emerald-600 text-white font-black`}>
                    व्हाट्सएप पर भेजें →
                  </button>
                </div>
              )}

              {/* Feedback and Complaints Alert Banner */}
              {st.pendingFeedbacks > 0 && (
                <div className="p-3.5 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border-2 border-amber-400 flex flex-wrap items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">💬</span>
                    <div>
                      <h4 className="font-black text-xs text-amber-900 dark:text-amber-200">
                        {st.pendingFeedbacks} नई शिकायत या सुझाव प्राप्त हुए हैं!
                      </h4>
                      <p className="text-[11px] text-amber-700 dark:text-amber-400">
                        इमाम व मुक़्तदियों के सुझाव देखें व समीक्षा करें।
                      </p>
                    </div>
                  </div>
                  <button onClick={() => setPage('feedback')} className={`${B} bg-amber-500 text-slate-900 font-black`}>
                    शिकायतें देखें →
                  </button>
                </div>
              )}

              {reqs.length > 0 && (
                <button onClick={() => setPage('plans')} className="w-full text-left p-4 rounded-2xl bg-amber-100 dark:bg-amber-900/30 border-2 border-amber-400 font-bold text-sm text-slate-900 dark:text-amber-200 flex items-center justify-between">
                  <span>🔔 {reqs.length} payment verification request(s) waiting for your review</span>
                  <span className="underline">Review Now →</span>
                </button>
              )}

              {/* Metrics Grid */}
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                {[
                  ['Total Mosques', st.total, `${st.active} Active · ${st.susp} Suspended`, '🕌'],
                  ['Paid Subscriptions', st.paid, `Active Money: ₹${st.activePaidRev}`, '💳'],
                  ['Total Verified Revenue', '₹' + st.revAll, `This Month: ₹${st.revMo}`, '💰'],
                  ['Followers (Muqtadi)', st.fol, `${st.live} Live Azan Broadcasting`, '👥'],
                  ['Verified (Blue Tick)', st.ver, 'Active Badges Granted', '🔵'],
                  ['Password Resets', st.pendingResets, 'Pending 1-Click WhatsApp', '🔑'],
                  ['Complaints & Feedback', st.pendingFeedbacks, 'User Suggestions', '💬'],
                  ['Pending UTRs', reqs.length, 'Payment Verification Queue', '🔔']

                  <div key={i} className={`${card} p-4 hover:shadow-md transition`}>
                    <div className="flex justify-between text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase">
                      <span>{t}</span>
                      <span>{ic}</span>
                    </div>
                    <div className="text-2xl sm:text-3xl font-black mt-1" style={{ color: S.accent }}>{v}</div>
                    <div className="text-[11px] text-slate-400 dark:text-slate-500 font-medium">{s}</div>
                  </div>
                ))}
              </div>

              {/* Charts & Quick Action Sections */}
              <div className="grid lg:grid-cols-2 gap-4">
                <div className={`${card} p-4`}>
                  <div className="flex justify-between items-center mb-3">
                    <h3 className="font-extrabold text-sm text-slate-900 dark:text-white">Mosques by State</h3>
                    <button onClick={() => setPage('regions')} className="text-xs text-emerald-600 dark:text-emerald-400 font-bold hover:underline">
                      Manage State Bans →
                    </button>
                  </div>
                  {st.byState.length === 0 ? (
                    <p className="text-xs text-slate-400">No registered mosques yet</p>
                  ) : (
                    st.byState.map(([k, v]) => (
                      <div key={k} className="mb-2.5">
                        <div className="flex justify-between text-xs mb-1">
                          <span className="font-bold text-slate-700 dark:text-slate-300">{k}</span>
                          <b className="font-mono text-slate-900 dark:text-white">{v}</b>
                        </div>
                        <div className="h-2 rounded-full bg-slate-100 dark:bg-slate-700 overflow-hidden">
                          <div className="h-2 rounded-full transition-all duration-500" style={{ width: `${(v / (st.byState[0][1] || 1)) * 100}%`, background: S.accent }} />
                        </div>
                      </div>
                    ))
                  )}
                </div>

                <div className={`${card} p-4`}>
                  <h3 className="font-extrabold text-sm mb-3 text-slate-900 dark:text-white">Plans Expiring in 7 Days</h3>
                  {st.soon.length === 0 ? (
                    <p className="text-xs text-slate-400 py-6 text-center">No subscriptions expiring in the next 7 days 🎉</p>
                  ) : (
                    <div className="space-y-2 max-h-64 overflow-y-auto thin">
                      {st.soon.map(m => (
                        <div key={m.id} className="flex items-center justify-between gap-2 py-2 border-b dark:border-slate-700 text-xs">
                          <div className="min-w-0">
                            <b className="block truncate text-slate-900 dark:text-white">{m.name}</b>
                            <span className="text-slate-500 dark:text-slate-400">{m.paymentExpiry} · {daysLeft(m.paymentExpiry)} day(s) remaining</span>
                          </div>
                          <a
                            target="_blank"
                            rel="noreferrer"
                            className={`${B} bg-[#25D366] text-white shrink-0 flex items-center gap-1 shadow-xs`}
                            href={waLink(m.phone, `Assalamu Alaikum Hazrat ${m.imamName || ''},\nYour ${S.brand} plan for ${m.name} ends on ${m.paymentExpiry}. UPI: ${S.upiId}`)}
                          >
                            💬 WhatsApp Remind
                          </a>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </>
          )}

          {/* ============ PAGE 2: MOSQUES MANAGEMENT (WITH FOLLOWER BADGE) ============ */}
          {page === 'masjids' && (
            <>
              {/* GLOBAL MASTER TOGGLE: ALL MASJIDS PAID MODE */}
              <div className="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3.5">
                <div className="flex items-start gap-3">
                  <div className={`w-11 h-11 rounded-2xl flex items-center justify-center text-xl shrink-0 shadow-sm ${S.allMasjidsPaidMode ? 'bg-amber-500/20 text-amber-500 border border-amber-400/40' : 'bg-emerald-500/20 text-emerald-600 border border-emerald-400/40'}`}>
                    {S.allMasjidsPaidMode ? '🔒' : '🌐'}
                  </div>
                  <div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <b className="text-sm font-black text-slate-900 dark:text-white">All Masjids Paid Mode (Lock All Services by Default)</b>
                      <span className={`text-[10px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider ${S.allMasjidsPaidMode ? 'bg-amber-500 text-slate-950 shadow-xs' : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300'}`}>
                        {S.allMasjidsPaidMode ? 'PAID MODE ACTIVE (ALL LOCKED)' : 'NORMAL MODE (FREE / UNLOCKED)'}
                      </span>
                    </div>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 leading-relaxed">
                      {S.allMasjidsPaidMode 
                        ? '⚠️ All Masjids Paid Mode चालू है: हर नई और unpaid मस्जिद के Namaz Time, Notice, Hadith और Live Azan बटन स्वतः लॉक रहेंगे।' 
                        : '✅ Normal Mode चालू है: मस्जिदें फ्री रहेंगी। आप नीचे किसी भी मस्जिद के अंदर जाकर 3 सेवाओं को अलग-अलग लॉक/अनलॉक कर सकते हैं।'}
                    </p>
                  </div>
                </div>
                <button
                  type="button"
                  onClick={toggleGlobalPaidMode}
                  className={`px-4 py-2.5 rounded-xl text-xs font-black shadow-md active:scale-95 transition shrink-0 ${
                    S.allMasjidsPaidMode
                      ? 'bg-rose-600 hover:bg-rose-700 text-white ring-2 ring-rose-400/40'
                      : 'bg-emerald-600 hover:bg-emerald-700 text-white'
                  }`}
                >
                  {S.allMasjidsPaidMode ? '🔴 Paid Mode बंद करें' : '🟢 All Masjids Paid Mode चालू करें'}
                </button>
              </div>

              <div className="flex flex-wrap items-end justify-between gap-2">
                <div>
                  <h2 className="text-base font-bold text-slate-900 dark:text-white">Mosques Directory</h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400">
                    Showing <b>{list.length}</b> of <b>{all.length}</b> mosques (फ़ॉलोअर्स, लाइव अज़ान, व ब्लू टिक स्थिति)
                  </p>
                </div>
                <div className="flex flex-wrap gap-2">
                  <button onClick={() => exportCsv(list)} className={`${B} text-white shadow-xs flex items-center gap-1`} style={{ background: S.accent }}>
                    <span>📥 Export Filtered CSV ({list.length})</span>
                  </button>
                  <button onClick={() => exportJson(list)} className={`${B} bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 shadow-xs flex items-center gap-1`}>
                    <span>📋 Export JSON ({list.length})</span>
                  </button>
                </div>
              </div>

              {/* Advanced 4-Column Filter Bar */}
              <div className={`${card} p-3.5 grid sm:grid-cols-2 lg:grid-cols-4 gap-2.5`}>
                <div>
                  <label className="block text-[11px] font-bold text-slate-500 dark:text-slate-400 mb-1">🔍 Search Name, ID, Phone, Imam</label>
                  <input
                    className={inp}
                    placeholder="e.g. Jama Masjid, Mau, Ballia, 9876…"
                    value={q}
                    onChange={e => setQ(e.target.value)}
                  />
                </div>

                <div>
                  <label className="block text-[11px] font-bold text-slate-500 dark:text-slate-400 mb-1">🏛️ State Filter (Smart Normalized)</label>
                  <select className={inp} value={fState} onChange={e => { setFState(e.target.value); setFDistrict('all'); }}>
                    <option value="all">All States ({statesInDb.length})</option>
                    {statesInDb.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>

                <div>
                  <label className="block text-[11px] font-bold text-slate-500 dark:text-slate-400 mb-1">🏙️ District / City Filter</label>
                  <select className={inp} value={fDistrict} onChange={e => setFDistrict(e.target.value)}>
                    <option value="all">All Districts ({districtsInDb.length})</option>
                    {districtsInDb.map(d => <option key={d} value={d}>{d}</option>)}
                  </select>
                </div>

                <div>
                  <label className="block text-[11px] font-bold text-slate-500 dark:text-slate-400 mb-1">⚙️ Status & Permissions Filter</label>
                  <select className={inp} value={fStat} onChange={e => setFStat(e.target.value)}>
                    <option value="all">All Status</option>
                    <option value="paid">💰 Paid Mosques</option>
                    <option value="free">🎁 Free Mosques</option>
                    <option value="expired">⚠️ Expired (Locked)</option>
                    <option value="pending">⏳ Pending UTR Review</option>
                    <option value="suspended">🚫 Suspended / Banned</option>
                    <option value="verified">🔵 Verified (Blue Tick)</option>
                    <option value="live">🔴 Live Azan Now</option>
                    <option value="azan_blocked">🔇 Live Azan Blocked (Manual)</option>
                    <option value="edit_locked">🔒 Time Edit Locked (Manual)</option>
                    <option value="nogps">📍 Location / GPS Missing</option>
                  </select>
                </div>
              </div>

              {/* Active Filters Summary Pills */}
              {(q || fState !== 'all' || fDistrict !== 'all' || fStat !== 'all') && (
                <div className="flex flex-wrap items-center gap-1.5 text-xs">
                  <span className="font-bold text-slate-500">Active Filters:</span>
                  {q && <span className="bg-slate-200 dark:bg-slate-700 px-2 py-0.5 rounded-full font-bold">Search: "{q}"</span>}
                  {fState !== 'all' && <span className="bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300 px-2 py-0.5 rounded-full font-bold">State: {fState}</span>}
                  {fDistrict !== 'all' && <span className="bg-sky-100 text-sky-800 dark:bg-sky-950/60 dark:text-sky-300 px-2 py-0.5 rounded-full font-bold">District: {fDistrict}</span>}
                  {fStat !== 'all' && <span className="bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 px-2 py-0.5 rounded-full font-bold">Status: {fStat}</span>}
                  <button onClick={() => { setQ(''); setFState('all'); setFDistrict('all'); setFStat('all'); }} className="text-rose-600 dark:text-rose-400 font-bold ml-1 hover:underline">
                    ✕ Clear All Filters
                  </button>
                </div>
              )}

              {!loaded ? (
                <p className="text-sm text-slate-400 text-center py-10">Loading mosques…</p>
              ) : list.length === 0 ? (
                <div className={`${card} p-10 text-center text-sm text-slate-400`}>No mosques match the selected filters.</div>
              ) : (
                <div className="space-y-3">
                  {list.map(m => {
                    const s = eff(m);
                    const la = (m.services && typeof m.services.liveAzan === 'boolean') ? m.services.liveAzan : (m.liveAzanAllowed !== false);
                    const te = (m.services && typeof m.services.profileServices === 'boolean') ? m.services.profileServices : (m.timeEditAllowed !== false);
                    const isVer = (m.services && typeof m.services.blueTick === 'boolean') ? m.services.blueTick : !!m.isVerified;
                    const isSusp = !!m.isSuspended;

                    return (
                      <div 
                        key={m.id} 
                        onClick={() => setView(m)}
                        className={`${card} p-3.5 sm:p-4 flex flex-col md:flex-row gap-3.5 md:items-center justify-between cursor-pointer hover:border-emerald-500/60 dark:hover:border-emerald-500/60 transition shadow-sm ${isSusp ? 'opacity-65 border-rose-300 dark:border-rose-900 bg-rose-50/20 dark:bg-rose-950/20' : ''}`}
                      >
                        <div className="flex gap-3.5 flex-1 min-w-0">
                          <img
                            src={m.photo || 'https://images.unsplash.com/photo-1542816417-0983c9c9ad53?auto=format&fit=crop&w=300&q=60'}
                            alt=""
                            className="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover shrink-0 border border-slate-200 dark:border-slate-700 shadow-xs"
                          />
                          <div className="min-w-0 flex-1">
                            <div className="flex flex-wrap items-center gap-1.5">
                              <b className="text-sm sm:text-base break-words text-slate-900 dark:text-white font-black">{m.name}</b>
                              {isVer && <Chip c="bg-sky-500 text-white shadow-xs font-black">✓ Verified Blue</Chip>}
                              {live[m.id] && <Chip c="bg-rose-600 text-white animate-pulse font-black">● LIVE AZAN</Chip>}
                              {isSusp && <Chip c="bg-rose-600 text-white font-black">🚫 SUSPENDED</Chip>}
                            </div>
                            
                            <div className="text-xs text-slate-500 dark:text-slate-400 break-words mt-0.5">
                              📍 {[m.address, m.stateLocation, normalizeState(m.stateName) || m.stateName].filter(Boolean).join(', ')}
                            </div>

                            <div className="text-[11.5px] text-slate-700 dark:text-slate-300 mt-1 flex flex-wrap gap-x-3 gap-y-0.5">
                              {m.imamName && <span>👳 <b>{m.imamName}</b></span>}
                              {m.phone && <span>📞 <span className="font-mono font-bold">{m.phone}</span></span>}
                              <span className="text-emerald-700 dark:text-emerald-400 font-bold">👥 {m.followersCount || 0} Followers</span>
                            </div>

                            <div className="flex flex-wrap items-center gap-1.5 mt-2">
                              <Chip c="bg-slate-100 dark:bg-slate-700 font-mono text-slate-700 dark:text-slate-300">ID: {m.id}</Chip>
                              <Chip c={STAT[s] || STAT.free}>{s.toUpperCase()}{m.paymentExpiry && s === 'paid' ? ` · ${daysLeft(m.paymentExpiry)}d` : ''}</Chip>
                              <Chip c={isVer ? 'bg-sky-100 text-sky-800 dark:bg-sky-950/60 dark:text-sky-300 font-bold' : 'bg-slate-100 text-slate-500 dark:bg-slate-800'}>
                                {isVer ? '🔵 Blue Tick: ON' : 'Blue Tick: OFF'}
                              </Chip>
                              <Chip c={la ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300 font-bold' : 'bg-rose-100 text-rose-800 dark:bg-rose-950/60 dark:text-rose-300 font-bold'}>
                                {la ? '📢 Azan: ON' : '📢 Azan: LOCKED'}
                              </Chip>
                              <Chip c={te ? 'bg-teal-100 text-teal-800 dark:bg-teal-950/60 dark:text-teal-300 font-bold' : 'bg-rose-100 text-rose-800 dark:bg-rose-950/60 dark:text-rose-300 font-bold'}>
                                {te ? '🛠️ Profile: ON' : '🛠️ Profile: LOCKED'}
                              </Chip>
                              {!hasGps(m) && <Chip c="bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300">No GPS</Chip>}
                            </div>
                          </div>
                        </div>

                        {/* Outside: ONLY ONE Clean Professional Button to View Details & Manage */}
                        <div className="flex items-center md:justify-end shrink-0 pt-2 md:pt-0" onClick={e => e.stopPropagation()}>
                          <button
                            type="button"
                            onClick={() => setView(m)}
                            className="w-full md:w-auto px-4 py-2.5 rounded-xl text-white font-extrabold text-xs shadow-md hover:shadow-lg active:scale-95 transition flex items-center justify-center gap-1.5 cursor-pointer"
                            style={{ background: `linear-gradient(135deg, ${S.accent}, #063b2c)` }}
                          >
                            <span>👁️ View & Manage</span>
                            <span className="text-[10px] text-emerald-200 font-normal">(पूरी जानकारी व कंट्रोल) →</span>
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}

          {/* ============ PAGE 3: SMART ALL-INDIA STATE & DISTRICT BAN CONTROLLER ============ */}
          {page === 'regions' && (
            <>
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h2 className="text-base font-bold text-slate-900 dark:text-white">All-India State & District Ban Controller</h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400">
                    पूरे देश के सभी 36 राज्यों व केंद्र शासित प्रदेशों और उनके ज़िलों को 1-क्लिक में बैन या प्री-बैन करें।
                  </p>
                </div>
                <input
                  className={`${inp} max-w-xs`}
                  placeholder="🔍 Search state or district…"
                  value={regionFilter}
                  onChange={e => setRegionFilter(e.target.value)}
                />
              </div>

              {/* ALL-INDIA 1-CLICK SELECTOR BAN CARD (FOR ANY STATE AND ANY DISTRICT) */}
              <div className={`${card} p-4 sm:p-5 border-2 border-rose-500 bg-rose-50/50 dark:bg-rose-950/20 space-y-3.5`}>
                <div className="flex items-center gap-2">
                  <span className="text-xl">🎯</span>
                  <h3 className="font-black text-sm text-rose-900 dark:text-rose-200 uppercase tracking-wide">
                    All-India Quick Ban Selector (पूरे देश का कोई भी राज्य या ज़िला बैन करें)
                  </h3>
                </div>
                <p className="text-xs text-slate-600 dark:text-slate-300">
                  चाहे उस राज्य या ज़िले में अभी कोई मस्जिद रजिस्टर हुई हो या नहीं — आप यहाँ से <b>Mau, Ballia, Azamgarh, Patna</b> या किसी भी राज्य/ज़िले को प्री-बैन कर सकते हैं।
                </p>

                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 pt-1">
                  {/* State Picker (All 36 States) */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-200 mb-1">
                      1. राज्य चुनें (Select State - 36 States/UTs)
                    </label>
                    <select
                      className={inp}
                      value={selBanState}
                      onChange={e => {
                        setSelBanState(e.target.value);
                        setSelBanDistrict('');
                      }}
                    >
                      {ALL_INDIA_STATES.map(stName => {
                        const count = all.filter(m => isMosqueInState(m, stName)).length;
                        return (
                          <option key={stName} value={stName}>
                            {stName} ({count} Mosques in DB)
                          </option>
                        );
                      })}
                    </select>
                  </div>

                  {/* District Picker of that State */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-200 mb-1">
                      2. ज़िला चुनें (Select District of {selBanState})
                    </label>
                    <select
                      className={inp}
                      value={selBanDistrict}
                      onChange={e => setSelBanDistrict(e.target.value)}
                    >
                      <option value="">-- ज़िला चुनें (Select District) --</option>
                      {(INDIA_STATE_DISTRICTS[selBanState] || []).map(dist => {
                        const count = all.filter(m => isMosqueInDistrict(m, dist)).length;
                        return (
                          <option key={dist} value={dist}>
                            {dist} ({count} Mosques)
                          </option>
                        );
                      })}
                    </select>
                  </div>

                  {/* Action Buttons */}
                  <div className="flex items-end gap-2">
                    <button
                      type="button"
                      onClick={() => handleBanState(selBanState)}
                      className={`${B} bg-rose-600 hover:bg-rose-700 text-white flex-1 py-2.5 font-black shadow-md flex items-center justify-center gap-1`}
                    >
                      <span>🚫 पूरा राज्य बैन करें</span>
                    </button>
                    {selBanDistrict && (
                      <button
                        type="button"
                        onClick={() => handleBanDistrict(selBanDistrict, selBanState)}
                        className={`${B} bg-rose-800 hover:bg-rose-900 text-white flex-1 py-2.5 font-black shadow-md flex items-center justify-center gap-1`}
                      >
                        <span>🚫 ज़िला बैन करें</span>
                      </button>
                    )}
                  </div>
                </div>

                {/* Custom write-in input for any village / town */}
                <form
                  onSubmit={e => {
                    e.preventDefault();
                    if (!customBanInput.trim()) return;
                    handleBanDistrict(customBanInput.trim(), selBanState);
                    setCustomBanInput('');
                  }}
                  className="pt-2 border-t border-rose-200 dark:border-rose-900/60 flex flex-wrap gap-2 items-center"
                >
                  <span className="text-xs font-bold text-slate-600 dark:text-slate-300">अन्य कोई कस्बा / मोहल्ला / ज़िला लिखें:</span>
                  <input
                    className={`${inp} max-w-xs`}
                    placeholder="e.g. Mau, Ballia, Kopaganj..."
                    value={customBanInput}
                    onChange={e => setCustomBanInput(e.target.value)}
                  />
                  <button type="submit" className={`${B} bg-rose-600 text-white font-bold`}>
                    + बैन सूची में जोड़ें
                  </button>
                </form>
              </div>

              {/* ACTIVE BLACKLIST (BANNED REGIONS CHIPS) */}
              {((S.bannedStates && S.bannedStates.length > 0) || (S.bannedDistricts && S.bannedDistricts.length > 0)) && (
                <div className={`${card} p-4 space-y-2 border-2 border-rose-500`}>
                  <div className="flex items-center justify-between">
                    <h4 className="font-extrabold text-sm text-rose-700 dark:text-rose-300 flex items-center gap-2">
                      <span>⛔ Currently Active Banned Regions (Blacklist)</span>
                      <span className="text-[10px] bg-rose-600 text-white px-2 py-0.5 rounded-full font-mono">
                        {(S.bannedStates?.length || 0) + (S.bannedDistricts?.length || 0)} Banned
                      </span>
                    </h4>
                  </div>

                  <div className="flex flex-wrap gap-2 pt-1">
                    {(S.bannedStates || []).map(s => {

                      </span>
                    </div>

                  {/* Bot Speed / Delay Selector (15s, 30s, 45s, 60s) */}

                    </div>
                    <div className="flex items-center gap-1.5">

                  {/* 5 Dynamic Message Templates Previewer & Custom Format Editor */}
                  <div className="p-3 bg-white dark:bg-slate-800 rounded-xl border dark:border-slate-700 space-y-2.5">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div>
                        <span className="text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1.5">

                          <span>WhatsApp SMS फॉर्मेट व टेम्पलेट कस्टमाइज़र:</span>
                        </span>
                        <p className="text-[11px] text-slate-500 dark:text-slate-400">

                      </div>
                      <button
                        type="button"
                        onClick={() => setShowTemplateEditor(!showTemplateEditor)}

                      </button>
                    </div>

                    {showTemplateEditor ? (
                      <div className="space-y-2.5 p-3 bg-slate-50 dark:bg-slate-900/60 rounded-xl border dark:border-slate-700">

                          {[

                            ['{masjidName}', 'मस्जिद नाम'],
                            ['{masjidId}', 'मस्जिद ID'],
                            ['{pin}', 'पासवर्ड PIN'],
                            ['{token}', 'टोकन'],
                            ['{time}', 'समय']

                            <button
                              key={tag}
                              type="button"
                              onClick={() => {
                                setCustomTemplateText(prev => (prev ? prev + ' ' : '') + tag);

                              + {tag} ({label})
                            </button>
                          ))}
                        </div>
                        <textarea
                          className="w-full p-2.5 rounded-lg border text-xs font-mono bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600 text-slate-900 dark:text-white h-32 focus:ring-2 focus:ring-emerald-500"
                          placeholder="यहाँ अपना कस्टम WhatsApp मैसेज लिखें... उदाहरण:
अस्सलाम अलैकुम हज़रत {imamName},
मस्जिद कनेक्ट ऐप में आपकी मस्जिद {masjidName} का लॉगिन विवरण:
मस्जिद ID: {masjidId}
पासवर्ड: {pin}
ऐप में इस ID और पासवर्ड से लॉगिन करें।"
                          value={customTemplateText}
                          onChange={e => setCustomTemplateText(e.target.value)}
                        />
                        <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                          <button
                            type="button"
                            onClick={() => {
                              localStorage.setItem('mca_custom_template', customTemplateText);
                              say('✅ नया SMS फॉर्मेट सफलतापूर्वक सेव हो गया!');
                              setShowTemplateEditor(false);
                            }}
                            className={`${B} bg-emerald-600 hover:bg-emerald-700 text-white font-bold`}
                          >
                            💾 यह नया फॉर्मेट सेव करें
                          </button>
                          {customTemplateText && (
                            <button
                              type="button"
                              onClick={() => {
                                setCustomTemplateText('');
                                localStorage.removeItem('mca_custom_template');
                                say('डिफ़ॉल्ट 5 टेम्पलेट्स पर वापस रीसेट किया गया!');
                              }}
                              className="text-xs text-rose-600 hover:underline font-bold cursor-pointer"
                            >
                              🔄 डिफ़ॉल्ट 5 टेम्पलेट्स पर रीसेट करें
                            </button>
                          )}
                        </div>
                      </div>
                    ) : (
                      <div>
                        {!customTemplateText && (
                          <div className="flex items-center justify-between mb-1.5">
                            <span className="text-[11px] text-slate-500">टेम्पलेट्स प्रीव्यू (T1 से T5):</span>
                            <div className="flex gap-1">
                              {[0, 1, 2, 3, 4].map(idx => (
                                <button
                                  key={idx}
                                  type="button"
                                  onClick={() => setSelectedTemplatePreviewIdx(idx)}
                                  className={`w-6 h-6 rounded-md text-[11px] font-bold transition cursor-pointer ${selectedTemplatePreviewIdx === idx ? 'bg-emerald-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}`}
                                >
                                  T{idx + 1}
                                </button>
                              ))}
                            </div>
                          </div>
                        )}
                        <div className="p-2.5 bg-slate-50 dark:bg-slate-900/70 rounded-lg border dark:border-slate-700 font-mono text-[11px] text-slate-700 dark:text-slate-300 whitespace-pre-wrap leading-relaxed">
                          {getDynamicResetMessage(
                            { id: 'req_demo', ts: Date.now(), imamName: 'मौलाना अकरम साहिब' },
                            { id: 'MASJID-101', name: 'जामा मस्जिद', passcode: '786' },
                            selectedTemplatePreviewIdx
                          ).text}
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                {/* Instant WhatsApp Sender to ANY Mosque */}
                <div className={`${card} p-4 sm:p-5 border border-slate-200 dark:border-slate-700 space-y-3`}>
                  <div className="flex items-center gap-2">
                    <span className="text-lg">💬</span>
                    <h3 className="font-extrabold text-xs text-slate-900 dark:text-white">
                      किसी भी मस्जिद के इमाम को तुरंत WhatsApp पर ID और पासवर्ड भेजें
                    </h3>
                  </div>
                  <div className="grid sm:grid-cols-2 gap-3 pt-0.5">
                    <div>
                      <select
                        className={inp}
                        onChange={e => {
                          const sel = masjids[e.target.value];
                          if (sel) {
                            const dyn = getDynamicResetMessage({ id: 'manual_' + Date.now(), ts: Date.now() }, sel, Math.floor(Math.random() * 5));
                            window.open(waLink(sel.phone, dyn.text), '_blank');
                            say(`${sel.name} को WhatsApp खोला गया`);
                          }
                        }}
                      >
                        <option value="">-- मस्जिद चुनें (WhatsApp भेजने के लिए) --</option>
                        {all.map(m => (
                          <option key={m.id} value={m.id}>
                            {m.name} (ID: {m.id}) - Phone: {m.phone || 'N/A'} - PIN: {m.passcode}
                          </option>

                      </select>
                    </div>
                    <div className="text-xs text-slate-500 dark:text-slate-400 flex items-center">
                      💡 ड्रॉपडाउन से चुनते ही 5 टेम्पलेट्स में से ऑटोमैटिक अलग मैसेज तैयार होकर WhatsApp में खुलेगा!
                    </div>
                  </div>
                </div>

                {/* Pending Reset Requests from Firestore */}
                <div className={`${card} p-4 space-y-3`}>
                  <div className="flex justify-between items-center border-b dark:border-slate-700 pb-2">
                    <h3 className="font-extrabold text-xs text-slate-900 dark:text-white flex items-center gap-2">
                      <span>🔔 पासवर्ड रीसेट अनुरोध सूची</span>
                      <span className="text-xs bg-emerald-100 text-emerald-800 dark:bg-emerald-950 px-2 py-0.5 rounded-full font-mono">
                        {groupedList.length} मस्जिदों से अनुरोध ({passwordResets.length} कुल)
                      </span>
                    </h3>
                    {pendingQueueCount > 0 && (
                      <span className="text-[11px] bg-amber-400 text-slate-950 px-2 py-0.5 rounded-full font-black animate-pulse">
                        {pendingQueueCount} लंबित (Pending)
                      </span>
                    )}
                  </div>

                  {groupedList.length === 0 ? (
                    <div className="py-10 text-center text-xs text-slate-400">
                      फिलहाल कोई पासवर्ड रीसेट अनुरोध लंबित नहीं है। जब भी कोई इमाम अनुरोध भेजेगा, यहाँ सुरक्षित कतार के साथ दिखेगा।
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {groupedList.map(g => {
                        const r = g.primary;
                        const targetMasjid = masjids[r.masjidId] || all.find(m => m.phone === r.phone) || {};
                        const phoneToUse = r.phone || targetMasjid.phone || '';
                        const imamName = r.imamName || targetMasjid.imamName || 'इमाम साहिब';
                        const masjidName = r.masjidName || targetMasjid.name || r.masjidId;
                        const pin = r.passcode || targetMasjid.passcode || 'N/A';
                        const isBanned = targetMasjid.isBanned || targetMasjid.isSuspended;

                        // Check status
                        const now = Date.now();
                        const lastSentTs = botSentHistory[r.masjidId || r.phone];
                        const sentRecently = lastSentTs && (now - lastSentTs < 24 * 60 * 60 * 1000);
                        const isSent = r.status === 'completed' || r.status === 'auto_merged';

                        const dynamicMsg = getDynamicResetMessage(r, targetMasjid, g.count % 5).text;

                        return (
                          <div key={r.id || g.latestTs} className={`p-4 rounded-xl border transition-all flex flex-col md:flex-row md:items-center justify-between gap-3 shadow-xs ${isBanned ? 'bg-rose-50/60 dark:bg-rose-950/20 border-rose-300 dark:border-rose-800' : 'bg-slate-50 dark:bg-slate-700/40 border-slate-200 dark:border-slate-700'}`}>
                            <div className="min-w-0 space-y-1">
                              <div className="flex flex-wrap items-center gap-2">
                                <b className="text-sm text-slate-900 dark:text-white">{masjidName}</b>
                                <span className="text-xs font-mono bg-slate-200 dark:bg-slate-700 px-1.5 py-0.5 rounded font-bold">
                                  ID: {targetMasjid.id || r.masjidId}
                                </span>
                                {g.count > 1 && (
                                  <span className="text-[10px] bg-amber-100 text-amber-900 dark:bg-amber-950 dark:text-amber-200 px-2 py-0.5 rounded-full font-bold">
                                    ⚠️ {g.count} बार अनुरोध आया
                                  </span>
                                )}
                                {isBanned ? (
                                  <Chip c="bg-rose-600 text-white font-bold">🚫 Banned</Chip>
                                ) : isSent ? (
                                  <Chip c="bg-emerald-600 text-white font-bold">✓ Sent</Chip>
                                ) : (
                                  <Chip c="bg-amber-400 text-slate-900 font-bold animate-pulse">Pending</Chip>
                                )}
                              </div>

                              <div className="text-xs text-slate-600 dark:text-slate-300">
                                👤 <b>{imamName}</b> · 📱 <b>{phoneToUse}</b> · 🔑 पासवर्ड: <span className="font-mono font-black text-emerald-600 dark:text-emerald-400">{pin}</span>
                              </div>

                              <div className="text-[11px] text-slate-400 flex flex-wrap items-center gap-2">
                                <span>समय: {g.latestTs ? new Date(g.latestTs).toLocaleString('en-GB') : 'Just now'}</span>
                                {sentRecently && (
                                  <span className="text-emerald-600 dark:text-emerald-400 font-bold">
                                    (हाल ही में भेजा गया)
                                  </span>
                                )}
                              </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2 shrink-0">
                              {phoneToUse ? (
                                <div className="flex flex-wrap items-center gap-1.5">
                                  {/* 1. कल वाला 1-CLICK WHATSAPP BUTTON (100% Guaranteed Delivery) */}
                                  <a
                                    target="_blank"
                                    rel="noreferrer"
                                    href={waLink(phoneToUse, dynamicMsg)}
                                    onClick={() => {
                                      completeAndResolveDuplicates(r, true);
                                      say(`${masjidName} को WhatsApp पासवर्ड भेजा गया!`);
                                    }}
                                    className={`${B} bg-[#25D366] hover:bg-[#20ba59] active:scale-95 text-white flex items-center gap-1.5 shadow-md font-extrabold`}
                                    title="सीधे WhatsApp खोलकर ID और पासवर्ड भेजें"
                                  >
                                    <span>💬 1-Click WhatsApp भेजें</span>
                                  </a>

                                  {/* 2. Baileys Backend Bot (यदि सर्वर पर QR लिंक्ड है) */}
                                  {serverBotStatus.connected && (
                                    <button
                                      type="button"
                                      disabled={botLoadingAction}
                                      onClick={() => sendViaBaileysBot(phoneToUse, dynamicMsg, r)}
                                      className={`${B} bg-emerald-700 hover:bg-emerald-800 active:scale-95 text-white flex items-center gap-1 shadow-xs font-bold`}
                                      title="लिंक्ड WhatsApp बॉट द्वारा बैकग्राउंड में पासवर्ड भेजें"
                                    >
                                      <span>⚡ बॉट से भेजें</span>
                                    </button>
                                  )}
                                </div>
                              ) : (
                                <span className="text-xs text-rose-500 font-bold">No Phone</span>
                              )}

                              {!isBanned && (
                                <button
                                  type="button"
                                  onClick={() => quickBanMosque(targetMasjid.id || r.masjidId)}
                                  className={`${B} bg-rose-600 hover:bg-rose-700 text-white flex items-center gap-1 font-bold`}
                                  title="इस मस्जिद को तुरंत बैन (Lock) करें"
                                >
                                  <span>🚫 बैन करें</span>
                                </button>
                              )}

                              <button
                                type="button"
                                onClick={() => {
                                  g.allRequests.forEach(req => deletePasswordReset(req.id));
                                }}
                                className={`${B} bg-slate-200 dark:bg-slate-600 hover:bg-rose-100 text-slate-700 dark:text-slate-200 hover:text-rose-700`}
                                title="अनुरोध हटाएँ"
                              >
                                🗑️ हटाएँ
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </>
            );
          })()}

          {/* ============ PAGE 5: COMPLAINTS & FEEDBACK (SHIKAYAT & SUJHAO) ============ */}
          {page === 'feedback' && (
            <>
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h2 className="text-base font-bold text-slate-900 dark:text-white">💬 शिकायत एवं सुझाव (Complaints & Feedback)</h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400">
                    यूज़र्स, मुक़्तदियों और इमामों द्वारा भेजी गई शिकायतें व सुझाव देखें और जब चाहें मिटाएं।
                  </p>
                </div>
              </div>

              <div className={`${card} p-4 space-y-3`}>
                <div className="flex justify-between items-center border-b dark:border-slate-700 pb-2">
                  <h3 className="font-extrabold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                    <span>📋 सभी प्राप्त शिकायतें व सुझाव</span>
                    <span className="text-xs bg-rose-100 text-rose-800 dark:bg-rose-950 px-2 py-0.5 rounded-full font-mono">
                      {feedbacks.length} Total
                    </span>
                  </h3>
                </div>

                {feedbacks.length === 0 ? (
                  <div className="py-12 text-center text-xs text-slate-400 space-y-2">
                    <p className="text-2xl">📬</p>
