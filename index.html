                    <p className="text-[11px]">उपयोगकर्ता जब भी मुख्य ऐप से शिकायत या सुझाव दर्ज करेंगे, वह सीधे यहाँ दिखाई देगी।</p>
                  </div>
                ) : (
                  <div className="space-y-3">
                    {feedbacks.map(f => {
                      const isResolved = f.status === 'resolved';
                      const tagColor = f.type === 'complaint' ? 'bg-rose-600 text-white' : f.type === 'bug' ? 'bg-amber-500 text-slate-900' : 'bg-sky-600 text-white';
                      const tagLabel = f.type === 'complaint' ? '⚠️ शिकायत' : f.type === 'bug' ? '🐛 बग / समस्या' : '💡 सुझाव';

                      return (
                        <div key={f.id} className={`p-4 rounded-xl border ${isResolved ? 'bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700 opacity-75' : 'bg-white dark:bg-slate-700/60 border-amber-300 dark:border-amber-700 shadow-xs'} space-y-2.5`}>
                          <div className="flex flex-wrap items-center justify-between gap-2">
                            <div className="flex items-center gap-2">
                              <Chip c={`${tagColor} font-bold`}>{tagLabel}</Chip>
                              <b className="text-sm text-slate-900 dark:text-white">{f.userName || 'Anonymous User'}</b>
                              {f.masjidName && <span className="text-xs text-slate-500">· 🕌 {f.masjidName}</span>}
                              {isResolved && <Chip c="bg-emerald-600 text-white font-bold">✓ Resolved</Chip>}
                            </div>
                            <span className="text-xs font-mono text-slate-400">
                              {f.ts ? new Date(f.ts).toLocaleString('en-GB') : (f.date || '')}
                            </span>
                          </div>

                          <p className="text-xs sm:text-sm text-slate-800 dark:text-slate-200 whitespace-pre-wrap leading-relaxed bg-slate-100 dark:bg-slate-800 p-3 rounded-lg border border-slate-200 dark:border-slate-700">
                            {f.message || f.body || f.text || ''}
                          </p>

                          <div className="flex flex-wrap items-center justify-between gap-2 pt-1 border-t dark:border-slate-700/60 text-xs">
                            <div className="text-slate-500 dark:text-slate-400">
                              {f.phone && <span>📱 फ़ोन / व्हाट्सएप: <b className="font-mono text-slate-900 dark:text-white">{f.phone}</b></span>}
                              {f.email && <span className="ml-2">📧 {f.email}</span>}
                            </div>

                            <div className="flex items-center gap-1.5 ml-auto">
                              {f.phone && (
                                <a
                                  target="_blank"
                                  rel="noreferrer"
                                  href={waLink(f.phone, `अस्सलाम अलैकुम ${f.userName || ''}, मस्जिद कनेक्ट टीम की ओर से आपके संदेश के संबंध में:`)}
                                  className={`${B} bg-[#25D366] text-white flex items-center gap-1 font-bold`}
                                >
                                  💬 व्हाट्सएप पर जवाब दें
                                </a>
                              )}
                              <button
                                onClick={() => toggleFeedbackResolved(f.id, f.status)}
                                className={`${B} ${isResolved ? 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200' : 'bg-emerald-600 text-white font-bold'}`}
                              >
                                {isResolved ? 'मार्क अनसुलझा (Undo)' : '✓ हल हुआ (Resolved)'}
                              </button>
                              {/* Permament Delete Button */}
                              <button
                                onClick={() => deleteFeedback(f.id)}

                              </button>

                    मासिक ₹{S.monthlyFee} · वार्षिक ₹{S.yearlyFee} — राशि के आधार पर स्वतः महीनों की गणना
                  </p>
                </div>
                <button onClick={() => setBulkPricingModal(true)} className={`${B} bg-amber-400 text-slate-900 font-black shadow-xs flex items-center gap-1`}>
                  <span>⚡ Special / Ramadan Pricing Controller</span>
                </button>
              </div>

              {/* Quick Stats Grid */}
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                {[
                  ['Paid Mosques', st.paid],
                  ['Active Subscriptions Rev', '₹' + st.activePaidRev],
                  ['Total Verified Revenue', '₹' + st.revAll],
                  ['Revenue This Month', '₹' + st.revMo]
                ].map(([t, v]) => (
                  <div key={t} className={`${card} p-4`}>
                    <div className="text-[11px] font-bold text-slate-500 uppercase">{t}</div>
                    <div className="text-2xl font-black mt-1" style={{ color: S.accent }}>{v}</div>
                  </div>

              </div>

              {/* Pending UTR Queue */}
              {reqs.length > 0 && (
                <div className="p-4 rounded-2xl bg-amber-50 dark:bg-amber-900/20 border-2 border-amber-400 space-y-2">
                  <h3 className="font-extrabold text-sm text-slate-900 dark:text-amber-200">🔔 Pending Payment Verification Requests ({reqs.length})</h3>
                  {reqs.map(r => (
                    <div key={r.id} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 py-2 border-t border-amber-200 dark:border-amber-800 text-xs">
                      <div>
                        <b className="text-slate-900 dark:text-white">{r.masjidName || r.masjidId}</b>
                        <span className="font-mono ml-2 font-bold bg-amber-200 dark:bg-amber-950 px-1.5 py-0.5 rounded">UTR: {r.utr || 'N/A'}</span>
                        <span className="text-slate-500 ml-2">₹{r.amount || '-'} {r.plan ? `(${r.plan})` : ''}</span>
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        <button onClick={() => approveReq(r, 'monthly')} className={`${B} bg-emerald-600 text-white`}>✅ Approve Plan</button>
                        <button onClick={() => rejectReq(r)} className={`${B} bg-rose-50 text-rose-700 border border-rose-300 dark:bg-rose-950/40 dark:text-rose-300`}>Reject</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Bulk Network Actions */}
              <div className={`${card} p-4 space-y-2`}>
                <h3 className="font-extrabold text-sm text-slate-900 dark:text-white">⚡ Global Network Bulk Actions</h3>
                <p className="text-[11px] text-slate-500 dark:text-slate-400">Applies across all {st.total} mosques.</p>
                <div className="flex flex-wrap gap-2 pt-1">
                  <button
                    className={`${B} bg-emerald-600 text-white`}
                    onClick={() => setConfirm({
                      t: 'Make ALL Mosques 100% Free?',
                      d: 'All mosques across India will receive free full access (Live Azan + Time Edit ON) with no payment requirement.',
                      go: () => batchPatch(all, () => ({ paymentPlan: 'free', paymentStatus: 'free', paymentAmount: 0, paymentExpiry: null, liveAzanAllowed: true, timeEditAllowed: true })).then(() => say('All mosques are now free'))
                    })}
                  >
                    🎁 Make ALL Mosques Free
                  </button>
                  <button
                    className={`${B} bg-rose-600 text-white`}
                    onClick={() => setConfirm({
                      t: 'Lock ALL Unpaid Mosques?',
                      d: 'Free and expired mosques will lose Live Azan and Time Editing until payment is made. Currently paid mosques will not be touched.',
                      go: () => batchPatch(all.filter(m => eff(m) !== 'paid'), () => ({ paymentStatus: 'expired', liveAzanAllowed: false, timeEditAllowed: false })).then(() => say('Unpaid mosques locked'))
                    })}
                  >
                    🔒 Lock ALL Unpaid Mosques
                  </button>
                  <button className={`${B} bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200`} onClick={() => exportCsv(all.filter(m => eff(m) !== 'free'))}>
                    📥 Export Subscriptions CSV
                  </button>
                </div>
              </div>

              {/* Payment Audit Logs (WITH VOID / DELETE BUTTON TO DIRECTLY REDUCE REVENUE) */}
              <div className={`${card} p-4`}>
                <div className="flex items-center justify-between mb-2">
                  <h3 className="font-extrabold text-sm text-slate-900 dark:text-white">Recent Payment Audit Log</h3>
                  <span className="text-xs text-slate-400">गलती से हुए भुगतान को मिटाने पर कुल रेवेन्यू तुरंत कम हो जाएगा</span>
                </div>
                {logs.length === 0 ? (
                  <p className="text-xs text-slate-400 py-4">No payments recorded yet.</p>
                ) : (
                  <div className="overflow-x-auto thin">
                    <table className="w-full text-xs">
                      <thead>
                        <tr className="text-left text-slate-500 border-b dark:border-slate-700">
                          <th className="py-2">Date</th>
                          <th>Mosque</th>
                          <th>Plan</th>
                          <th>Amount</th>
                          <th>Note</th>
                          <th className="text-right">Action (Void)</th>
                        </tr>
                      </thead>
                      <tbody>
                        {logs.slice(0, 25).map(l => (
                          <tr key={l.id} className="border-t dark:border-slate-700/60">
                            <td className="py-2 font-mono text-slate-500">{l.date}</td>
                            <td className="font-bold text-slate-900 dark:text-white">{l.masjidName}</td>
                            <td className="capitalize">{l.plan}</td>
                            <td><b className="text-emerald-600 dark:text-emerald-400">₹{l.amount}</b></td>
                            <td className="text-slate-500 truncate max-w-xs">{l.note}</td>
                            <td className="text-right py-1">
                              <button
                                onClick={() => deletePaymentLog(l.id, l.amount, l.masjidName)}
                                className="px-2 py-1 rounded bg-rose-50 text-rose-700 border border-rose-300 dark:bg-rose-950/40 dark:text-rose-300 text-[10px] font-bold hover:bg-rose-600 hover:text-white transition"
                                title="भुगतान रद्द करें व रेवेन्यू कम करें"
                              >
                                🗑️ रद्द करें (Void)
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

              {/* Subscriptions List */}
              <div className={`${card} p-4 space-y-2`}>
                <h3 className="font-extrabold text-sm text-slate-900 dark:text-white">All Mosque Subscriptions</h3>
                {[...all].sort((a, b) => (a.paymentExpiry || 'z').localeCompare(b.paymentExpiry || 'z')).map(m => {
                  const s = eff(m);
                  return (
                    <div key={m.id} className="flex flex-wrap items-center justify-between gap-2 py-2 border-t dark:border-slate-700 text-xs">
                      <div className="min-w-0">
                        <b className="text-slate-900 dark:text-white">{m.name}</b>
                        <Chip c={STAT[s]}>{s.toUpperCase()}</Chip>
                        <span className="text-slate-500 dark:text-slate-400 capitalize ml-1.5">
                          {m.paymentPlan || 'free'}{m.paymentExpiry ? ` · Valid till ${m.paymentExpiry} (${daysLeft(m.paymentExpiry)}d)` : ''}
                        </span>
                      </div>
                      <div className="flex gap-1.5">
                        <button onClick={() => activateWithAmount(m, S.monthlyFee || 10, S.monthlyFee || 10)} className={`${B} bg-emerald-600 text-white`}>+1 Month</button>
                        <button onClick={() => activateWithAmount(m, S.yearlyFee || 99, S.monthlyFee || 10)} className={`${B} bg-emerald-800 text-white`}>+1 Year</button>
                        <button onClick={() => setPlanM(m)} className={`${B} bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-200`}>Edit</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </>
          )}

          {/* ============ PAGE 7: BROADCAST ============ */}
          {page === 'broadcast' && (
            <>
              <div>
                <h2 className="text-base font-bold text-slate-900 dark:text-white">Push Broadcast to All Users</h2>
                <p className="text-xs text-slate-500 dark:text-slate-400">Send an instant alert notice to all connected users and mosques</p>
              </div>
              <form onSubmit={sendAnn} className={`${card} p-4 sm:p-5 space-y-3`}>
                <div>
                  <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">Broadcast Title</label>
                  <input className={inp} placeholder="e.g. Ramadan Mubarak / Server Maintenance Notice" value={nt} onChange={e => setNt(e.target.value)} required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">Message Content</label>
                  <textarea rows="4" className={inp} placeholder="Write announcement details..." value={nb} onChange={e => setNb(e.target.value)} required />
                </div>
                <button className={`${B} text-white py-3 w-full shadow-md`} style={{ background: S.accent }}>
                  📡 Send Broadcast Live
                </button>
              </form>

              <div className={`${card} p-4 space-y-2`}>
                <h3 className="font-extrabold text-sm text-slate-900 dark:text-white">Broadcast History</h3>
                {anns.length === 0 ? (
                  <p className="text-xs text-slate-400 py-3">No announcements sent yet</p>
                ) : (
                  anns.map(a => (
                    <div key={a.id} className="p-3 rounded-xl bg-slate-50 dark:bg-slate-700/50 text-xs">
                      <div className="flex justify-between font-bold">
                        <b className="text-slate-900 dark:text-white">{a.title}</b>
                        <span className="text-slate-400 font-mono">{a.date}</span>
                      </div>
                      <p className="mt-1 whitespace-pre-wrap text-slate-700 dark:text-slate-300">{a.body}</p>
                    </div>
                  ))
                )}
              </div>
            </>
          )}

          {/* ============ PAGE 8: SETTINGS ============ */}
          {page === 'settings' && (
            <>
              <div>
                <h2 className="text-base font-bold text-slate-900 dark:text-white">Admin & System Settings</h2>
                <p className="text-xs text-slate-500 dark:text-slate-400">Brand identity, UPI IDs, subscription fees, and admin security</p>
              </div>
              <form onSubmit={saveSettings} className="space-y-4">
                <div className={`${card} p-4 space-y-3`}>
                  <h3 className="font-extrabold text-sm text-slate-900 dark:text-white">🎨 Brand Identity & Theme</h3>
                  <div className="flex items-center gap-4">
                    <div className="w-20 h-20 rounded-2xl flex items-center justify-center overflow-hidden shadow-sm" style={{ background: draft.accent }}>
                      {draft.logo ? <img src={draft.logo} alt="" className="w-full h-full object-cover" /> : <span className="text-3xl">🕌</span>}
                    </div>
                    <div className="space-x-2">
                      <input id="logoIn" type="file" accept="image/*" className="hidden" onChange={e => e.target.files[0] && compress(e.target.files[0], 160, 0.85).then(u => setDraft(d => ({ ...d, logo: u }))).catch(() => say('Image error', 'err'))} />
                      <label htmlFor="logoIn" className={`${B} bg-slate-100 dark:bg-slate-700 cursor-pointer inline-block`}>📸 Upload Logo</label>
                      {draft.logo && <button type="button" onClick={() => setDraft(d => ({ ...d, logo: '' }))} className={`${B} bg-rose-50 text-rose-700`}>Remove</button>}
                    </div>
                  </div>
                  <div className="grid sm:grid-cols-2 gap-3">
                    <label className="text-xs font-bold block">Panel Name<input className={inp} value={draft.brand} onChange={e => setDraft({ ...draft, brand: e.target.value })} /></label>
                    <label className="text-xs font-bold block">Tagline<input className={inp} value={draft.tagline} onChange={e => setDraft({ ...draft, tagline: e.target.value })} /></label>
                  </div>
                  <div>
                    <div className="text-xs font-bold mb-1">Accent Color</div>
                    <div className="flex flex-wrap items-center gap-2">
                      {['#0c6b4f', '#0f766e', '#1d4ed8', '#7c3aed', '#be123c', '#b45309', '#0f172a'].map(c => (
                        <button type="button" key={c} onClick={() => setDraft({ ...draft, accent: c })} className="w-9 h-9 rounded-full border-4" style={{ background: c, borderColor: draft.accent === c ? '#facc15' : 'transparent' }} />
                      ))}
                      <input type="color" value={draft.accent} onChange={e => setDraft({ ...draft, accent: e.target.value })} className="w-10 h-10 rounded cursor-pointer" />
                    </div>
                  </div>
                </div>

                <div className={`${card} p-4 space-y-3`}>
                  <h3 className="font-extrabold text-sm text-slate-900 dark:text-white">💳 Mosque Subscription Fees & Payment QR</h3>
                  <div className="grid sm:grid-cols-2 gap-3">
                    <label className="text-xs font-bold block">Monthly Fee (₹)<input type="number" min="0" className={inp} value={draft.monthlyFee} onChange={e => setDraft({ ...draft, monthlyFee: e.target.value })} /></label>
                    <label className="text-xs font-bold block">Yearly Fee (₹)<input type="number" min="0" className={inp} value={draft.yearlyFee} onChange={e => setDraft({ ...draft, yearlyFee: e.target.value })} /></label>
                  </div>
                  <label className="text-xs font-bold block">Promo Announcement Banner (Optional)<input className={inp} value={draft.promoNote} onChange={e => setDraft({ ...draft, promoNote: e.target.value })} placeholder="e.g. Ramadan Mubarak Special: 1 Year at ₹99" /></label>
                  <div className="flex flex-wrap items-center gap-4">
                    <img src={draft.qrPhoto || qrImg(draft.upiId, draft.brand, draft.yearlyFee)} alt="QR" className="w-28 h-28 rounded-xl border bg-white p-1" />
                    <div className="flex-1 min-w-[200px] space-y-2">
                      <label className="text-xs font-bold block">Subscription Payment UPI ID<input className={`${inp} font-mono`} value={draft.upiId} onChange={e => setDraft({ ...draft, upiId: e.target.value })} /></label>
                      <input id="qr1" type="file" accept="image/*" className="hidden" onChange={e => e.target.files[0] && compress(e.target.files[0], 500).then(u => setDraft(d => ({ ...d, qrPhoto: u })))} />
                      <label htmlFor="qr1" className={`${B} bg-slate-100 dark:bg-slate-700 cursor-pointer inline-block`}>📸 Upload Custom QR</label>
                      {draft.qrPhoto && <button type="button" onClick={() => setDraft({ ...draft, qrPhoto: '' })} className={`${B} bg-rose-50 text-rose-700 ml-2`}>Use Auto QR</button>}
                    </div>
                  </div>
                </div>

                <div className={`${card} p-4 space-y-3`}>
                  <h3 className="font-extrabold text-sm text-slate-900 dark:text-white">💝 Public Voluntary Server Support (Donations)</h3>
                  <div className="flex flex-wrap items-center gap-4">
                    <img src={draft.serverQr || qrImg(draft.serverUpi, draft.brand)} alt="QR" className="w-28 h-28 rounded-xl border bg-white p-1" />
                    <div className="flex-1 min-w-[200px] space-y-2">
                      <label className="text-xs font-bold block">Donation UPI ID<input className={`${inp} font-mono`} value={draft.serverUpi} onChange={e => setDraft({ ...draft, serverUpi: e.target.value })} /></label>
                      <input id="qr2" type="file" accept="image/*" className="hidden" onChange={e => e.target.files[0] && compress(e.target.files[0], 500).then(u => setDraft(d => ({ ...d, serverQr: u })))} />
                      <label htmlFor="qr2" className={`${B} bg-slate-100 dark:bg-slate-700 cursor-pointer inline-block`}>📸 Upload Custom QR</label>
                      {draft.serverQr && <button type="button" onClick={() => setDraft({ ...draft, serverQr: '' })} className={`${B} bg-rose-50 text-rose-700 ml-2`}>Use Auto QR</button>}
                    </div>
                  </div>
                  <label className="text-xs font-bold block">Donation Appeal Message<textarea rows="3" className={inp} value={draft.supportMessage} onChange={e => setDraft({ ...draft, supportMessage: e.target.value })} /></label>
                </div>

                <div className={`${card} p-4 space-y-3`}>
                  <h3 className="font-extrabold text-sm text-slate-900 dark:text-white">📞 Helpline & Contact Details</h3>
                  <div className="grid sm:grid-cols-2 gap-3">
                    <label className="text-xs font-bold block">Helpline Phone<input className={inp} value={draft.phone} onChange={e => setDraft({ ...draft, phone: e.target.value })} /></label>
                    <label className="text-xs font-bold block">WhatsApp Number (with 91)<input className={inp} value={draft.whatsapp} onChange={e => setDraft({ ...draft, whatsapp: e.target.value })} /></label>
                  </div>
                </div>

                <div className={`${card} p-4 space-y-3`}>
                  <h3 className="font-extrabold text-sm text-slate-900 dark:text-white">🔐 Admin Security & Passcode</h3>
                  <div className="grid sm:grid-cols-2 gap-3">
                    <label className="text-xs font-bold block">
                      Master Admin Passcode (Default: 786)
                      <input className={`${inp} font-mono`} value={draft.adminPasscode || '786'} onChange={e => setDraft({ ...draft, adminPasscode: e.target.value })} />
                    </label>
                    <div>
                      <div className="text-xs font-bold mb-1">Current Logged-in Identity</div>
                      <div className="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700/60 font-mono text-xs font-bold text-slate-700 dark:text-slate-300">
                        {user.email || 'Super Admin (Master Passcode)'}
                      </div>
                    </div>
                  </div>
                </div>

                <div className="flex flex-wrap gap-2 pt-2">
                  <button type="submit" className={`${B} text-white py-3 px-6 text-sm shadow-md`} style={{ background: S.accent }}>
                    💾 Save All Settings
                  </button>
                  {user.email && user.email.includes('@') && auth && (
                    <button
                      type="button"
                      onClick={() => auth.sendPasswordResetEmail(user.email).then(() => say('Password reset email sent to ' + user.email)).catch(e => say(e.message, 'err'))}
                      className={`${B} bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 py-3`}
                    >
                      🔑 Email me Password Reset Link
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => {
                      const u = URL.createObjectURL(new Blob([JSON.stringify({ at: new Date().toISOString(), settings: S, masjids }, null, 2)], { type: 'application/json' }));
                      const a = document.createElement('a');
                      a.href = u;
                      a.download = `masjid_connect_backup_${today()}.json`;
                      a.click();
                      say('Backup downloaded');
                    }}
                    className={`${B} bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 py-3`}
                  >
                    💾 Download JSON Cloud Backup
                  </button>
                </div>
              </form>
            </>
          )}
        </main>
      </div>

      {/* ============ MODAL: FULL VIEW & ALL-IN-ONE MANAGEMENT HUB ============ */}
      {view && (() => {
        const m = masjids[view.id] || view;
        const inf = m.info || {};
        const sch = m.schedule || {};
        const s = eff(m);
        const [showPin, setShowPin] = [view._pin, p => setView({ ...view, _pin: p })];
        const isBlueOn = (m.services && typeof m.services.blueTick === 'boolean') ? m.services.blueTick : !!m.isVerified;
        const isAzanOn = (m.services && typeof m.services.liveAzan === 'boolean') ? m.services.liveAzan : (m.liveAzanAllowed !== false);
        const isProfOn = (m.services && typeof m.services.profileServices === 'boolean') ? m.services.profileServices : (m.timeEditAllowed !== false);

        return (
          <Modal wide title={m.name} sub={`Mosque ID: ${m.id} · ऑल-इन-वन मस्जिद कंट्रोल हब`} onClose={() => setView(null)}>
            {/* Top Identity Card */}
            <div className="flex gap-4 flex-wrap items-start p-4 rounded-2xl bg-slate-50 dark:bg-slate-750 border border-slate-200 dark:border-slate-700">
              <img
                src={m.photo || 'https://images.unsplash.com/photo-1542816417-0983c9c9ad53?auto=format&fit=crop&w=300&q=60'}
                alt=""
                className="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl object-cover border-2 border-emerald-600/30 shrink-0 shadow-sm"
              />
              <div className="flex-1 min-w-[220px]">
                <div className="flex flex-wrap items-center gap-1.5 mb-2">
                  <Chip c={STAT[s]}>{s.toUpperCase()}</Chip>
                  {isBlueOn && <Chip c="bg-sky-500 text-white font-black shadow-xs">✓ Verified Blue</Chip>}
                  {m.isSuspended && <Chip c="bg-rose-600 text-white font-black">🚫 Suspended</Chip>}
                  {live[m.id] && <Chip c="bg-rose-600 text-white animate-pulse font-black">● LIVE AZAN NOW</Chip>}
                  <Chip c="bg-slate-200 dark:bg-slate-700 font-mono font-bold">ID: {m.id}</Chip>
                </div>
                <h3 className="text-base sm:text-lg font-black text-slate-900 dark:text-white leading-tight">
                  {m.name}
                </h3>
                <div className="text-xs text-slate-500 dark:text-slate-400 mt-1 leading-snug">
                  📍 {[m.address, m.stateLocation, normalizeState(m.stateName) || m.stateName].filter(Boolean).join(', ')}
                </div>
                {hasGps(m) ? (
                  <a className="text-xs underline font-bold mt-1.5 inline-flex items-center gap-1 text-emerald-700 dark:text-emerald-300" target="_blank" rel="noreferrer" href={`https://www.google.com/maps?q=${m.lat},${m.lng}`}>
                    🧭 Google Maps रास्ता देखें ({Number(m.lat).toFixed(4)}, {Number(m.lng).toFixed(4)}) →
                  </a>
                ) : (
                  <span className="text-xs text-amber-600 font-bold block mt-1">⚠️ No GPS Coordinates</span>
                )}
              </div>
            </div>

            {/* ⚡ 3-CATEGORY SERVICE CONTROLS (THE CORE MANAGEMENT TOGGLES) */}
            <div className="mt-4 p-4 rounded-2xl bg-gradient-to-br from-slate-50 to-emerald-50/30 dark:from-slate-800 dark:to-slate-800 border-2 border-emerald-500/40 shadow-sm">
              <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                <div>
                  <h4 className="font-black text-sm text-[#07382c] dark:text-emerald-300 flex items-center gap-1.5">
                    <span>⚡ 3 Service Controls (मस्जिद सेवाएं चालू / बंद)</span>
                  </h4>
                  <p className="text-xs text-slate-500 dark:text-slate-400">
                    यहाँ से आप इस मस्जिद के लिए कोई भी एक सेवा चालू रख सकते हैं और बाकी बंद कर सकते हैं:
                  </p>
                </div>
                <span className="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300">
                  Dual Broadcast: Firestore + MQTT Live
                </span>
              </div>

              <div className="grid sm:grid-cols-3 gap-3">
                {/* 1. Blue Tick */}
                <div className={`p-3.5 rounded-2xl border-2 flex flex-col justify-between transition ${isBlueOn ? 'bg-sky-50 dark:bg-sky-950/40 border-sky-400 dark:border-sky-700' : 'bg-white dark:bg-slate-750 border-slate-200 dark:border-slate-700'}`}>
                  <div>
                    <div className="flex items-center justify-between gap-1 mb-1">
                      <span className="font-black text-xs text-slate-900 dark:text-white flex items-center gap-1">
                        <span>🔵</span> 1. Blue Tick
                      </span>
                      <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${isBlueOn ? 'bg-sky-500 text-white shadow-xs' : 'bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-300'}`}>
                        {isBlueOn ? 'ACTIVE (ON)' : 'OFF'}
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-500 dark:text-slate-400 leading-snug">
                      मस्जिद के नाम के आगे वेरिफाइड नीला टिक दिखेगा।
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => toggleMasjidService(m, 'blueTick', 'Blue Tick')}
                    className={`mt-3 w-full py-2 rounded-xl text-xs font-black shadow-xs active:scale-95 transition cursor-pointer ${
                      isBlueOn 
                        ? 'bg-rose-50 text-rose-700 border border-rose-300 hover:bg-rose-100 dark:bg-rose-950/40 dark:text-rose-300' 
                        : 'bg-sky-600 hover:bg-sky-700 text-white'
                    }`}
                  >
                    {isBlueOn ? '❌ Blue Tick बंद करें' : '🔵 Blue Tick चालू करें'}
                  </button>
                </div>

                {/* 2. Live Azan */}
                <div className={`p-3.5 rounded-2xl border-2 flex flex-col justify-between transition ${isAzanOn ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-400 dark:border-emerald-700' : 'bg-rose-50 dark:bg-rose-950/40 border-rose-300 dark:border-rose-800'}`}>
                  <div>
                    <div className="flex items-center justify-between gap-1 mb-1">
                      <span className="font-black text-xs text-slate-900 dark:text-white flex items-center gap-1">
                        <span>📢</span> 2. Live Azan
                      </span>
                      <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${isAzanOn ? 'bg-emerald-600 text-white shadow-xs' : 'bg-rose-600 text-white shadow-xs'}`}>
                        {isAzanOn ? 'ACTIVE (ON)' : 'LOCKED'}
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-500 dark:text-slate-400 leading-snug">
                      इमाम साहब अज़ान लाइव ब्रॉडकास्ट कर सकेंगे।
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => toggleMasjidService(m, 'liveAzan', 'Live Azan')}
                    className={`mt-3 w-full py-2 rounded-xl text-xs font-black shadow-xs active:scale-95 transition cursor-pointer ${
                      isAzanOn 
                        ? 'bg-rose-50 text-rose-700 border border-rose-300 hover:bg-rose-100 dark:bg-rose-950/40 dark:text-rose-300' 
                        : 'bg-emerald-600 hover:bg-emerald-700 text-white'
                    }`}
                  >
                    {isAzanOn ? '🔇 Live Azan रोकें' : '📢 Live Azan चालू करें'}
                  </button>
                </div>

                {/* 3. Profile Services */}
                <div className={`p-3.5 rounded-2xl border-2 flex flex-col justify-between transition ${isProfOn ? 'bg-teal-50 dark:bg-teal-950/40 border-teal-400 dark:border-teal-700' : 'bg-rose-50 dark:bg-rose-950/40 border-rose-300 dark:border-rose-800'}`}>
                  <div>
                    <div className="flex items-center justify-between gap-1 mb-1">
                      <span className="font-black text-xs text-slate-900 dark:text-white flex items-center gap-1">
                        <span>🛠️</span> 3. Profile Services
                      </span>
                      <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${isProfOn ? 'bg-teal-600 text-white shadow-xs' : 'bg-rose-600 text-white shadow-xs'}`}>
                        {isProfOn ? 'ACTIVE (ON)' : 'LOCKED'}
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-500 dark:text-slate-400 leading-snug">
                      Namaz Time, Hadith, Notice व प्रोफाइल के सभी बटन।
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => toggleMasjidService(m, 'profileServices', 'Profile Services')}
                    className={`mt-3 w-full py-2 rounded-xl text-xs font-black shadow-xs active:scale-95 transition cursor-pointer ${
                      isProfOn 
                        ? 'bg-rose-50 text-rose-700 border border-rose-300 hover:bg-rose-100 dark:bg-rose-950/40 dark:text-rose-300' 
                        : 'bg-teal-700 hover:bg-teal-800 text-white'
                    }`}
                  >
                    {isProfOn ? '🔒 प्रोफाइल सेवाएं लॉक करें' : '🔓 प्रोफाइल सेवाएं चालू करें'}
                  </button>
                </div>
              </div>
            </div>

            {/* Imam & Access Credentials Box */}
            <div className="mt-4 p-4 rounded-2xl bg-slate-50 dark:bg-slate-750 border border-slate-200 dark:border-slate-700 space-y-3">
              <div className="flex items-center justify-between border-b pb-2 dark:border-slate-700">
                <h4 className="font-black text-xs uppercase text-slate-500 dark:text-slate-400">
                  👳 Imam & Login Credentials (लॉगिन विवरण)
                </h4>
                {m.phone && (
                  <a
                    target="_blank"
                    rel="noreferrer"
                    href={waLink(m.phone, `अस्सलाम अलैकुम हज़रत ${m.imamName || ''},\n\nमस्जिद कनेक्ट ऐप में आपकी मस्जिद का लॉगिन विवरण:\n🕌 मस्जिद: ${m.name}\n🆔 मस्जिद ID: ${m.id}\n🔑 पासवर्ड (PIN): ${m.passcode}\n\nऐप में इस ID और पासवर्ड से लॉगिन करें।`)}
                    className="px-3 py-1 rounded-xl bg-[#25D366] hover:bg-[#20bd5a] text-white text-xs font-black flex items-center gap-1.5 shadow-xs transition"
                  >
                    <span>💬 WhatsApp ID/Password</span>
                  </a>
                )}
              </div>

              <div className="grid sm:grid-cols-2 gap-x-6 gap-y-2 text-xs">
                <div>
                  <Row l="इमाम साहब" v={m.imamName || 'दर्ज नहीं'} />
                  <Row l="मोबाइल नंबर" v={m.phone ? <a href={`tel:${m.phone}`} className="font-mono font-bold text-emerald-700 dark:text-emerald-400 underline">{m.phone}</a> : 'दर्ज नहीं'} />
                  <Row l="पासवर्ड (PIN)" v={
                    <span className="flex items-center gap-2">
                      <span className="font-mono font-black text-emerald-700 dark:text-emerald-400 text-sm">
                        {showPin ? m.passcode : '••••'}
                      </span>
                      <button className="text-[11px] underline text-slate-500 font-bold" onClick={() => setShowPin(!showPin)}>
                        {showPin ? 'Hide' : 'Show'}
                      </button>
                      <button 
                        className="text-[10px] px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 font-bold hover:bg-slate-300 transition"
                        onClick={() => { navigator.clipboard.writeText(m.passcode); say('Password Copied'); }}
                      >
                        📋 Copy
                      </button>
                      <button
                        className="text-[10px] px-2 py-0.5 rounded bg-amber-100 text-amber-900 dark:bg-amber-950/60 dark:text-amber-300 font-bold hover:bg-amber-200 transition"
                        onClick={async () => {
                          const newP = prompt('नया पासवर्ड (PIN) दर्ज करें:', m.passcode);
                          if (newP && newP.trim() && newP.trim() !== m.passcode) {
                            await patch(m.id, { passcode: newP.trim() });
                            say(`Password changed to: ${newP.trim()}`);
                          }
                        }}
                      >
                        ✏️ Change
                      </button>
                    </span>
                  } />
                </div>
                <div>
                  <Row l="मुक़्तदी फ़ॉलोअर्स" v={<span className="font-black text-emerald-700 dark:text-emerald-300">👥 {m.followersCount || 0} फ़ॉलोअर्स</span>} />
                  <Row l="रजिस्ट्रेशन तारीख" v={m.registeredAtISO ? m.registeredAtISO.slice(0, 10) : 'N/A'} />
                  <Row l="अंतिम अपडेट" v={m.updatedAt ? new Date(m.updatedAt).toLocaleString('en-GB') : 'N/A'} />
                </div>
              </div>
            </div>

            {/* Subscription & Plan Management Box */}
            <div className="mt-4 p-4 rounded-2xl bg-amber-50/50 dark:bg-amber-950/20 border border-amber-300 dark:border-amber-800 space-y-3">
              <div className="flex items-center justify-between border-b pb-2 border-amber-200 dark:border-amber-800/60">
                <h4 className="font-black text-xs uppercase text-amber-900 dark:text-amber-300 flex items-center gap-1.5">
                  <span>💳 Subscription & Plan Manager</span>
                </h4>
                <Chip c={STAT[s]}>{s.toUpperCase()}</Chip>
              </div>

              <div className="grid sm:grid-cols-2 gap-x-6 gap-y-2 text-xs">
                <div>
                  <Row l="Current Plan" v={m.paymentPlan || 'free'} />
                  <Row l="Status" v={s} />
                  <Row l="Valid Till" v={m.paymentExpiry ? `${m.paymentExpiry} (${daysLeft(m.paymentExpiry)} days remaining)` : 'No expiry set'} />
                </div>
                <div>
                  <Row l="Paid Amount" v={m.paymentAmount ? '₹' + m.paymentAmount : '₹0'} />
                  <Row l="Pending UTR" v={m.pendingUtr || 'None'} />
                  <Row l="Notes" v={m.paymentNotes || 'None'} />
                </div>
              </div>

              <div className="pt-2 border-t border-amber-200 dark:border-amber-800/60 flex flex-wrap items-center gap-2">
                <span className="text-[11px] font-bold text-slate-600 dark:text-slate-300">Quick Plan Renewal:</span>
                <button
                  type="button"
                  onClick={async () => {
                    const exp = futureDate(30);
                    await patch(m.id, { paymentPlan: 'monthly', paymentStatus: 'paid', paymentExpiry: exp, paymentAmount: 10 });
                    say(`${m.name}: 1 Month Extended till ${exp}`);
                  }}
                  className="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300 text-xs font-bold hover:bg-emerald-200 active:scale-95 transition cursor-pointer"
                >
                  +1 Month
                </button>
                <button
                  type="button"
                  onClick={async () => {
                    const exp = futureDate(180);
                    await patch(m.id, { paymentPlan: 'half_yearly', paymentStatus: 'paid', paymentExpiry: exp, paymentAmount: 50 });
                    say(`${m.name}: 6 Months Extended till ${exp}`);
                  }}
                  className="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300 text-xs font-bold hover:bg-emerald-200 active:scale-95 transition cursor-pointer"
                >
                  +6 Months
                </button>
                <button
                  type="button"
                  onClick={async () => {
                    const exp = futureDate(365);
                    await patch(m.id, { paymentPlan: 'yearly', paymentStatus: 'paid', paymentExpiry: exp, paymentAmount: 499 });
                    say(`${m.name}: 1 Year Extended till ${exp}`);
                  }}
                  className="px-3 py-1 rounded-lg bg-emerald-600 text-white text-xs font-black shadow-xs hover:bg-emerald-700 active:scale-95 transition cursor-pointer"
                >
                  +1 Year
                </button>
                <button
                  type="button"
                  onClick={async () => {
                    await patch(m.id, { paymentPlan: 'free', paymentStatus: 'free', paymentAmount: 0, paymentExpiry: null });
                    say(`${m.name}: Marked 100% Free`);
                  }}
                  className="px-2.5 py-1 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 text-xs font-bold hover:bg-slate-300 active:scale-95 transition cursor-pointer"
                >
                  Mark Free
                </button>
              </div>
            </div>

            {/* Namaz Times & Additional Mosque Info */}
            <div className="grid md:grid-cols-2 gap-x-6 mt-4">
              <div>
                <h4 className="font-extrabold text-xs uppercase text-slate-400 mt-2">Namaz Times (Azan / Jamat)</h4>
                {[
                  ['Fajr', 'fajr', 'fajrJamat'],
                  ['Zuhr', 'zuhr', 'zuhrJamat'],
                  ['Asr', 'asr', 'asrJamat'],
                  ['Maghrib', 'maghrib', 'maghribJamat'],
                  ['Isha', 'isha', 'ishaJamat'],
                  ['Juma', 'jumaAzan', 'jumaJamat']
                ].map(([l, a, j]) => <Row key={l} l={l} v={sch[a] ? `${sch[a]} / ${sch[j] || '-'}` : ''} />)}
                <Row l="Sunrise / Sunset" v={sch.sunrise ? `${sch.sunrise} / ${sch.sunset || '-'}` : ''} />
                <Row l="Daily Hadith" v={m.dailyHadith ? `${m.dailyHadith} (${m.dailyHadithRef || ''})` : 'Not set'} />
              </div>

              <div>
                <h4 className="font-extrabold text-xs uppercase text-slate-400 mt-4">Mosque Details & Info</h4>
                <Row l="Maktab" v={inf.maktabHas === 'yes' ? 'Yes' : inf.maktabHas === 'no' ? 'No' : ''} />
                <Row l="Maktab Time" v={inf.maktabTime} />
                <Row l="Maktab Fee" v={inf.maktabFee} />
                <Row l="Ustaad Name" v={inf.ustaadName} />
                <Row l="Juma Khutba" v={inf.jumaKhutba} />
                <Row l="Eid Time" v={inf.eidTime} />
                <Row l="Taraweeh" v={inf.taraweeh} />
                <Row l="Facilities" v={(inf.facilities || []).join(', ')} />
                <Row l="Committee" v={[inf.committeeName, inf.committeePhone].filter(Boolean).join(' · ')} />
                <Row l="Donation UPI" v={inf.upiId} />
              </div>
            </div>

            {inf.upiQr && (
              <div className="mt-3">
                <div className="text-xs font-bold mb-1">Mosque Donation QR</div>
                <img src={inf.upiQr} alt="" className="w-36 h-36 object-contain bg-white border rounded-xl p-1" />
              </div>
            )}

            {/* Bottom Actions Footer */}
            <div className="flex flex-wrap items-center gap-2 mt-5 pt-4 border-t dark:border-slate-700">
              <button 
                type="button"
                onClick={() => { setEdit(m); }} 
                className={`${B} bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 flex items-center gap-1.5 cursor-pointer`}
              >
                ✏️ Edit Mosque Details
              </button>
              
              <button 
                type="button"
                onClick={() => toggleFlag(m, 'isSuspended', 'Suspension')} 
                className={`${B} ${m.isSuspended ? 'bg-emerald-600 text-white' : 'bg-rose-50 text-rose-700 border border-rose-300 hover:bg-rose-100 dark:bg-rose-950/40 dark:text-rose-300'} cursor-pointer`}
              >
                {m.isSuspended ? '✅ Restore Mosque' : '🚫 Suspend Mosque'}
              </button>

              <button 
                type="button"
                onClick={() => setDel(m)} 
                className={`${B} bg-rose-600 hover:bg-rose-700 text-white ml-auto flex items-center gap-1.5 cursor-pointer`}
              >
                🗑️ Delete Mosque
              </button>
            </div>
          </Modal>
        );
      })()}

      {/* ============ MODAL: EDIT ============ */}
      {edit && (
        <Modal title="Edit Mosque Information" sub={`ID: ${edit.id}`} onClose={() => setEdit(null)}>
          <form className="space-y-3 text-xs" onSubmit={async e => {
            e.preventDefault();
            const f = e.target;
            const la = parseFloat(f.lat.value), ln = parseFloat(f.lng.value);
            const ok = !isNaN(la) && !isNaN(ln) && la !== 0 && ln !== 0;
            const d = {
              name: f.nm.value.trim(),
              address: f.ad.value.trim(),
              stateLocation: f.ct.value.trim(),
              stateName: normalizeState(f.sn.value.trim()) || f.sn.value.trim(),
              imamName: f.im.value.trim(),
              phone: f.ph.value.trim(),
              passcode: f.pw.value.trim(),
              liveAzanAllowed: f.la.checked,
              timeEditAllowed: f.te.checked,
              isVerified: f.vf.checked,
              isSuspended: f.sp.checked
            };
            if (ok) { d.lat = la; d.lng = ln; }
            await patch(edit.id, d);
            setEdit(null);
            say('Mosque updated successfully');
          }}>
            <label className="block font-bold">Mosque Name<input name="nm" className={inp} defaultValue={edit.name} required /></label>
            <div className="grid grid-cols-2 gap-2">
              <label className="font-bold">Address / Mohalla<input name="ad" className={inp} defaultValue={edit.address} /></label>
              <label className="font-bold">City / District (e.g. Mau, Ballia)<input name="ct" className={inp} defaultValue={edit.stateLocation} /></label>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <label className="font-bold">State (e.g. Uttar Pradesh, Bihar)<input name="sn" className={inp} defaultValue={edit.stateName} /></label>
              <label className="font-bold">Imam Name<input name="im" className={inp} defaultValue={edit.imamName} /></label>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <label className="font-bold">Phone Number<input name="ph" className={inp} defaultValue={edit.phone} /></label>
              <label className="font-bold">Password (PIN)<input name="pw" className={`${inp} font-mono`} defaultValue={edit.passcode} required /></label>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <label className="font-bold">Latitude (GPS)<input name="lat" className={`${inp} font-mono`} defaultValue={edit.lat || ''} /></label>
              <label className="font-bold">Longitude (GPS)<input name="lng" className={`${inp} font-mono`} defaultValue={edit.lng || ''} /></label>
            </div>
            <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-700/50 grid grid-cols-2 gap-2 font-bold">
              <label className="flex items-center gap-1.5"><input type="checkbox" name="la" defaultChecked={edit.liveAzanAllowed !== false} /> Live Azan Allowed</label>
              <label className="flex items-center gap-1.5"><input type="checkbox" name="te" defaultChecked={edit.timeEditAllowed !== false} /> Time Edit Allowed</label>
              <label className="flex items-center gap-1.5"><input type="checkbox" name="vf" defaultChecked={!!edit.isVerified} /> 🔵 Verified Blue Tick</label>
              <label className="flex items-center gap-1.5 text-rose-600"><input type="checkbox" name="sp" defaultChecked={!!edit.isSuspended} /> 🚫 Suspended</label>
            </div>
            <div className="flex gap-2 pt-2">
              <button type="button" onClick={() => setEdit(null)} className={`${B} bg-slate-100 dark:bg-slate-700 flex-1 py-3 text-slate-800 dark:text-slate-200`}>Cancel</button>
              <button type="submit" className={`${B} text-white flex-[2] py-3 shadow-md`} style={{ background: S.accent }}>Save Changes</button>
            </div>
          </form>
        </Modal>
      )}

      {/* ============ MODAL: PLAN & AUTO MULTI-MONTH CALCULATION ============ */}
      {planM && (() => {
        const m = masjids[planM.id] || planM;
        const s = eff(m);
        const autoMonths = Math.max(1, Math.floor((Number(calcAmt) || 0) / (Number(calcRate) || 10)));
        const autoExpiry = addMonths(today(), autoMonths);

        return (
          <Modal title="Manage Plan & Access Permissions" sub={`${m.name} · Current: ${s.toUpperCase()}${m.paymentExpiry ? ' till ' + m.paymentExpiry : ''}`} onClose={() => setPlanM(null)}>
            {/* Quick Auto-Calculation Box */}
            <div className="p-3.5 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-700 space-y-2 mb-3">
              <div className="flex justify-between items-center text-xs font-bold text-amber-950 dark:text-amber-200">
                <span>⚡ ऑटो-कैलकुलेशन (भुगतान राशि अनुसार)</span>
                <span className="font-mono bg-amber-200 dark:bg-amber-800 px-2 py-0.5 rounded">
                  ₹{calcRate}/महीना दर
                </span>
              </div>
              <div className="grid grid-cols-2 gap-2 text-xs">
                <label className="font-bold">प्राप्त राशि (₹)
                  <input
                    type="number"
                    className={inp}
                    value={calcAmt}
                    onChange={e => setCalcAmt(Number(e.target.value) || 0)}
                  />
                </label>
                <label className="font-bold">मासिक दर (₹/महीना)
                  <input
                    type="number"
                    className={inp}
                    value={calcRate}
                    onChange={e => setCalcRate(Number(e.target.value) || 10)}
                  />
                </label>
              </div>
              <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-amber-200 dark:border-amber-800 text-xs flex justify-between items-center">
                <span><b>{autoMonths} महीने</b> की सर्विस सक्रिय होगी</span>
                <b className="text-emerald-600 dark:text-emerald-400 font-mono">वैध: {autoExpiry}</b>
              </div>
              <button
                type="button"
                onClick={() => activateWithAmount(m, calcAmt, calcRate).then(() => setPlanM(null))}
                className="w-full py-2.5 rounded-xl text-white font-black text-xs shadow-md transition"
                style={{ background: S.accent }}
              >
                ⚡ ₹{calcAmt} के अनुसार {autoMonths} महीने तुरंत सक्रिय करें
              </button>
            </div>

            <div className="grid grid-cols-2 gap-2 mb-4 text-xs">
              <button onClick={async () => {
                await patch(m.id, { paymentPlan: 'free', paymentStatus: 'free', paymentAmount: 0, paymentExpiry: null, liveAzanAllowed: true, timeEditAllowed: true });
                say('Marked Free (Amount reset to ₹0)');
                setPlanM(null);
              }} className="p-2.5 rounded-xl bg-sky-100 dark:bg-sky-950/60 text-sky-900 dark:text-sky-200 font-bold text-left">
                🎁 Free / Waived (Reset ₹0)
              </button>
              <button onClick={async () => {
                await patch(m.id, { paymentStatus: 'expired', liveAzanAllowed: false, timeEditAllowed: false });
                say('Access Locked');
                setPlanM(null);
              }} className="p-2.5 rounded-xl bg-rose-100 dark:bg-rose-950/60 text-rose-900 dark:text-rose-200 font-bold text-left">
                🔒 Lock Access Now
              </button>
            </div>

            <form className="space-y-3.5 text-xs border-t dark:border-slate-700 pt-3" onSubmit={async e => {
              e.preventDefault();
              const f = e.target;
              const status = f.sts.value;
              const amt = Number(f.amt.value) || 0;
              const liveAllowed = f.pLive.checked;
              const timeAllowed = f.pTime.checked;
              const verified = f.pVer.checked;
              const suspended = f.pSusp.checked;

              await patch(m.id, {
                paymentPlan: f.pl.value,
                paymentStatus: status,
                paymentAmount: amt,
                paymentExpiry: f.ex.value || null,
                paymentNotes: f.nt.value.trim(),
                liveAzanAllowed: liveAllowed,
                timeEditAllowed: timeAllowed,
                isVerified: verified,
                isSuspended: suspended
              });

              if (status === 'paid' && amt > 0) {
                await logPay(m, f.pl.value, amt, 'Manual Plan Update');
              }
              say('Plan & custom feature permissions saved!');
              setPlanM(null);
            }}>
              <div className="font-bold text-slate-500 uppercase text-[10px]">Payment Plan & Expiry</div>
              <div className="grid grid-cols-2 gap-2">
                <label className="font-bold">Plan Type
                  <select name="pl" className={inp} defaultValue={m.paymentPlan || 'monthly'}>
                    <option value="monthly">Monthly</option>
                    <option value="yearly">Yearly</option>
                    <option value="free">Free</option>
                    <option value="lifetime">Lifetime</option>
                  </select>
                </label>
                <label className="font-bold">Status
                  <select name="sts" className={inp} defaultValue={m.paymentStatus || 'free'}>
                    <option value="paid">Paid</option>
                    <option value="free">Free</option>
                    <option value="pending">Pending</option>
                    <option value="expired">Expired (Locked)</option>
                  </select>
                </label>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <label className="font-bold">Amount Paid (₹)
                  <input name="amt" type="number" className={inp} defaultValue={m.paymentAmount || calcAmt} />
                </label>
                <label className="font-bold">Valid Till Expiry Date
                  <input name="ex" type="date" className={inp} defaultValue={m.paymentExpiry || autoExpiry} />
                </label>
              </div>
              <label className="font-bold block">Payment Note
                <input name="nt" className={inp} defaultValue={m.paymentNotes || ''} placeholder="e.g. Paid via Cash / UTR / ₹30 for 3 Months" />
              </label>

              {/* INDEPENDENT GRANULAR TOGGLES FOR PAID MOSQUE */}
              <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-700/60 border border-slate-200 dark:border-slate-600 space-y-2">
                <div className="font-extrabold text-slate-700 dark:text-slate-200 uppercase text-[10px] tracking-wide">
                  ⚙️ Individual Feature Controls (Paid होने पर भी कोई सर्विस बंद कर सकते हैं)
                </div>
                <div className="grid grid-cols-2 gap-2 font-bold">
                  <label className="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" name="pLive" defaultChecked={m.liveAzanAllowed !== false} />
                    <span>Live Azan Allowed</span>
                  </label>
                  <label className="flex items-center gap-1.5 cursor-pointer">
                    <input type="checkbox" name="pTime" defaultChecked={m.timeEditAllowed !== false} />
                    <span>Time Edit Allowed</span>
                  </label>
                  <label className="flex items-center gap-1.5 cursor-pointer text-sky-700 dark:text-sky-300">
                    <input type="checkbox" name="pVer" defaultChecked={!!m.isVerified} />
                    <span>🔵 Blue Tick Verified</span>
                  </label>
                  <label className="flex items-center gap-1.5 cursor-pointer text-rose-600 dark:text-rose-400">
                    <input type="checkbox" name="pSusp" defaultChecked={!!m.isSuspended} />
                    <span>🚫 Suspend Account</span>
                  </label>
                </div>
              </div>

              <div className="flex gap-2 pt-1">
                <button type="button" onClick={() => setPlanM(null)} className={`${B} bg-slate-100 dark:bg-slate-700 flex-1 py-3 text-slate-800 dark:text-slate-200`}>Cancel</button>
                <button type="submit" className={`${B} text-white flex-[2] py-3 shadow-md font-bold`} style={{ background: S.accent }}>Save Plan & Permissions</button>
              </div>
            </form>
          </Modal>
        );
      })()}

      {/* ============ MODAL: SEASONAL PRICING ============ */}
      {bulkPricingModal && (
        <Modal title="⚡ Special / Seasonal Pricing Controller" sub="Ek click me sabhi masjido ke liye annual discount fee set karein" onClose={() => setBulkPricingModal(false)}>
          <div className="space-y-4 text-xs">
            <div>
              <div className="font-bold text-slate-700 dark:text-slate-300 mb-1.5">Preset Offers:</div>
              <div className="grid grid-cols-4 gap-2">
                {[49, 99, 199, 299].map(p => (
                  <button
                    key={p}
                    type="button"
                    onClick={() => {
                      setBulkSeasonalFee(p);
                      setBulkSeasonalNote(`Annual Access at just ₹${p}`);
                    }}
                    className={`p-2.5 rounded-xl border text-center font-black transition ${bulkSeasonalFee === p ? 'bg-amber-400 text-slate-900 border-amber-500 shadow-sm' : 'bg-slate-100 dark:bg-slate-700'}`}
                  >
                    ₹{p}/yr
                  </button>
                ))}
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <label className="font-bold block">Yearly Special Fee (₹)
                <input type="number" className={inp} value={bulkSeasonalFee} onChange={e => setBulkSeasonalFee(Number(e.target.value) || 0)} />
              </label>
              <label className="font-bold block">Offer Banner Note
                <input className={inp} value={bulkSeasonalNote} onChange={e => setBulkSeasonalNote(e.target.value)} />
              </label>
            </div>

            <div className="flex gap-2 pt-2">
              <button type="button" onClick={() => setBulkPricingModal(false)} className={`${B} bg-slate-100 dark:bg-slate-700 flex-1 py-3 text-slate-800 dark:text-slate-200`}>Cancel</button>
              <button
                type="button"
                onClick={async () => {
                  const updatedSettings = {
                    ...S,
                    yearlyFee: bulkSeasonalFee,
                    promoNote: bulkSeasonalNote,
                    updatedAt: Date.now()
                  };
                  setS(updatedSettings);
                  if (db) await db.collection('config').doc('admin_settings').set(updatedSettings, { merge: true });
                  try {
                    if (mq && mq.connected) mq.publish(`${TOPIC}/db/admin_settings`, JSON.stringify(updatedSettings), { retain: true, qos: 1 });
                  } catch(e) {}
                  setBulkPricingModal(false);
                  say(`Pricing updated to ₹${bulkSeasonalFee}/yr!`);
                }}
                className={`${B} text-white flex-[2] py-3 font-black shadow-md`}
                style={{ background: S.accent }}
              >
                Apply Special Pricing Everywhere
              </button>
            </div>
          </div>
        </Modal>
      )}

      {/* ============ MODAL: DELETE CONFIRMATION ============ */}
      {del && (
        <Modal title="Delete Mosque Permanently?" sub={del.name} onClose={() => setDel(null)}>
          <p className="text-sm mb-4 text-slate-700 dark:text-slate-300">
            Are you sure you want to delete <b>{del.name}</b> (ID: {del.id})? All namaz timetables, live broadcast records, and details will be erased from the cloud database permanently. This cannot be undone.
          </p>
          <div className="flex gap-2">
            <button onClick={() => setDel(null)} className={`${B} bg-slate-100 dark:bg-slate-700 flex-1 py-3 text-slate-800 dark:text-slate-200`}>Cancel</button>
            <button onClick={() => delMasjid(del)} className={`${B} bg-rose-600 text-white flex-1 py-3 font-bold shadow-md`}>Delete Mosque</button>
          </div>
        </Modal>
      )}

      {/* ============ MODAL: GENERAL CONFIRMATION ============ */}
      {confirm && (
        <Modal title={confirm.t} onClose={() => setConfirm(null)}>
          <p className="text-sm mb-4 text-slate-700 dark:text-slate-300 leading-relaxed">{confirm.d}</p>
          <div className="flex gap-2">
            <button onClick={() => setConfirm(null)} className={`${B} bg-slate-100 dark:bg-slate-700 flex-1 py-3 text-slate-800 dark:text-slate-200`}>Cancel</button>
            <button onClick={() => { const g = confirm.go; setConfirm(null); if (g) g(); }} className={`${B} bg-rose-600 text-white flex-1 py-3 font-black shadow-md`}>
              Yes, Confirm Action
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
</script>
</body>
</html>
